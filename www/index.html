<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fml workbench</title>
<style>
  /* Shared design language with the budget portal (app.html). */
  :root {
    color-scheme: light; /* committed light design, portal-matched */
    --navy: #16283f; --navy2: #1e3554; --navy3: #27436a;
    --bg: #f4f6f9; --card: #ffffff; --line: #e3e7ee;
    --ink: #1c2430; --mut: #6b7686; --pri: #2f6fd0; --pri2: #e8f0fc;
    --ok: #1e8e3e; --okbg: #e6f4ea; --warn: #b06000; --warnbg: #fdf3e1;
    --bad: #c5221f; --badbg: #fce8e6; --amber: #fff8e1; --amber2: #f9edc0;
    --accent: var(--pri); --dim: #eef1f6;
    --mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 var(--sans); color: var(--ink); background: var(--bg);
         margin: 0; height: 100vh; display: flex; flex-direction: column; }
  button { font: inherit; font-size:.82rem; font-weight:600; border:0; border-radius:6px;
    padding:.28rem .75rem; background:var(--pri2); color:var(--pri); cursor:pointer; }
  button:hover { filter: brightness(.96); }
  input, select, textarea { font: inherit; color: inherit; }

  /* ---- navy app bar ---- */
  header { display:flex; align-items:center; gap:.8rem; padding:.5rem 1.1rem;
           background: var(--navy); color:#cfd9e6; flex-wrap:wrap; row-gap:.35rem; }
  header .brand { color:#fff; font-weight:700; font-size:1rem; letter-spacing:.3px; line-height:1.1; }
  header .brand small { display:block; font-weight:400; color:#8fa3bb; font-size:.6rem;
    letter-spacing:1px; text-transform:uppercase; margin-top:.1rem; }
  #modelSel { background:var(--navy2); color:#fff; border:1px solid var(--navy3);
    border-radius:6px; padding:.28rem .5rem; font-size:.85rem; max-width:12em; }
  /* ---- the menu bar: File · Model · Scenario · View, checks at right ---- */
  #menubar { display:flex; align-items:center; gap:.1rem; }
  header .actions { display:contents; }
  header .menu { position:relative; }
  header .menu.right { margin-left:auto; }
  header .mbtn { background:transparent; border:0; color:#cfd9e6; font-size:.85rem;
    font-weight:500; padding:.32rem .7rem; border-radius:6px; }
  header .mbtn:hover, header .menu.open .mbtn { background:var(--navy2); color:#fff; filter:none; }
  #checksLbl { font-weight:600; color:#8fe2ac; }
  #checksLbl.bad { color:#ffa19c; animation: throb 1.2s ease-in-out infinite; }
  @keyframes throb { 50% { opacity:.55; } }
  header .mdrop { display:none; position:absolute; top:calc(100% + 5px); left:0; z-index:30;
    background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 12px 40px rgba(16,30,54,.28); min-width:210px; padding:.35rem; }
  header .menu.open .mdrop { display:block; }
  header .mdrop.rt { left:auto; right:0; }
  header .mdrop button { display:flex; width:100%; text-align:left; background:transparent;
    color:var(--ink); border:0; border-radius:6px; font-size:.84rem; font-weight:500;
    padding:.42rem .6rem; cursor:pointer; align-items:center; gap:.5rem; }
  header .mdrop button:hover { background:var(--pri2); color:var(--pri); filter:none; }
  header .mdrop .mkey { margin-left:auto; color:var(--mut); font-size:.72rem; }
  header .msep { height:1px; background:var(--line); margin:.3rem .2rem; }
  header .minfo { display:block; padding:.3rem .6rem; font-size:.78rem; color:var(--mut); }
  header .minfo button { display:inline; width:auto; padding:0 .2rem; color:var(--pri);
    text-decoration:underline; font-size:inherit; }
  header .mdrop input, header .mdrop select { border:1px solid var(--line); background:#fff;
    color:var(--ink); border-radius:5px; padding:.22rem .4rem; font-size:.8rem; margin:.15rem 0; }
  /* selectable items carry a leading checkmark slot */
  header .views button::before, #scen button::before { content:""; display:inline-block; width:1em; }
  header .views button.on::before, #scen button.on::before { content:"✓"; color:var(--pri); font-weight:700; }
  header .views button.on, #scen button.on { color:var(--pri); font-weight:600; }
  header .views, #scen { display:block; }
  #simBtn.on::after { content:"active"; margin-left:auto; color:#7b3ff2; font-size:.7rem;
    font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  #draftState:empty { display:none; }
  /* checks dropdown: one row per assert */
  #asserts { display:block; min-width:240px; }
  #asserts .pass, #asserts .fail { display:block; padding:.32rem .6rem; border-radius:6px;
    font-size:.82rem; }
  #asserts .pass { color: var(--ok); }
  #asserts .fail { color: var(--bad); background:var(--badbg); font-weight:700; }
  .pass::before { content:"✓ "; } .fail::before { content:"✗ "; }

  /* ---- status strips ---- */
  #scenBanner { padding:.45rem 1.1rem; background:var(--warnbg); color:var(--warn);
    border-bottom:1px solid var(--line); font-weight:600; font-size:.86rem;
    display:flex; gap:1rem; align-items:center; }
  #scenBanner button { background:#fff; color:var(--warn); border:1px solid var(--amber2); }
  #procBanner { padding:.45rem 1.1rem; background:var(--pri2); border-bottom:1px solid var(--line);
    display:flex; gap:.7rem; align-items:center; flex-wrap:wrap; font-size:.86rem; }
  #procBanner.locked { background:var(--badbg); }
  #procBanner .tag { background:#fff; border:1px solid var(--line); border-radius:999px;
    padding:.06rem .6rem; font-size:.76rem; font-weight:600; color:var(--mut); }
  #procBanner .tag.sub { color:var(--warn); border-color:var(--amber2); background:var(--warnbg); }
  #procBanner button { background:var(--pri); color:#fff; font-size:.76rem; padding:.2rem .7rem; }

  /* ---- floating consoles ---- */
  #admin { position:fixed; right:1rem; top:4.5rem; width:min(560px, 92vw); max-height:78vh; overflow:auto;
    background:var(--card); border:1px solid var(--line); border-radius:12px; z-index:8;
    box-shadow:0 12px 40px rgba(16,30,54,.25); padding:1rem 1.2rem; }
  #admin h3 { margin:.2rem 0 .5rem; font-size:.98rem; }
  #admin h4 { margin:1rem 0 .35rem; font-size:.72rem; color:var(--mut);
    text-transform:uppercase; letter-spacing:.8px; }
  #admin table { width:100%; font-size:.83rem; border-collapse:collapse; }
  #admin td, #admin th { text-align:left; padding:.3rem .5rem; border-bottom:1px solid var(--line); }
  #admin th { color:var(--mut); font-size:.72rem; text-transform:uppercase; letter-spacing:.5px; }
  #admin .close { float:right; cursor:pointer; color:var(--mut); }
  #admin input { font:.78rem var(--mono); width:100%; border:1px solid var(--line);
    border-radius:6px; padding:.3rem .5rem; background:#fafbfd; }
  #admin .role-admin { color:#7b3ff2; font-weight:700; }
  #admin .role-editor { color:var(--pri); font-weight:600; }
  #admin .role-viewer { color:var(--mut); }
  #admin .k-patch { color:var(--pri); font-weight:600; } #admin .k-formula { color:#7b3ff2; font-weight:600; }
  #admin .k-submit { color:var(--warn); font-weight:600; } #admin .k-lock { color:var(--bad); font-weight:700; }
  #admin .k-reopen { color:var(--ok); font-weight:600; }
  #landing { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--navy); z-index:20; }
  #landing .card { background:var(--card); border-radius:14px; padding:2rem 2.2rem;
    width:min(420px, 92vw); box-shadow:0 20px 60px rgba(0,0,0,.4); }
  #landing .card p { color:var(--mut); font-size:.88rem; }
  #landing input { width:100%; margin:.6rem 0 1rem; padding:.55rem .7rem;
    border:1px solid var(--line); border-radius:8px; }
  #landing button { width:100%; background:var(--pri); color:#fff; padding:.5rem; }

  /* ---- layout: editor | splitter | grid ---- */
  main { flex:1; display:grid; grid-template-columns: minmax(280px, 34%) 6px 1fr; min-height:0; }
  /* Hidden panes leave the grid flow, so single-pane views use a single
     column — the remaining pane auto-places into it. */
  body.view-code main, body.view-grid main { grid-template-columns: 1fr !important; }
  body.view-code #right, body.view-code #split { display:none; }
  body.view-grid #left, body.view-grid #split { display:none; }
  #split { cursor: col-resize; background: transparent; position:relative; }
  #split::after { content:""; position:absolute; inset:0 2px; background: var(--line); }
  #split:hover::after { background: var(--pri); }

  /* ---- the code editor (mono lives here) ---- */
  #left { display:flex; flex-direction:column; min-height:0; background:var(--card);
    border-right:1px solid var(--line); }
  #ftabs { display:flex; gap:0; padding:0 .5rem; background:#eef1f6; border-bottom:1px solid var(--line); }
  #ftabs button { background:transparent; color:var(--mut); border:0; border-radius:0;
    font-size:.76rem; font-weight:500; padding:.4rem .8rem; border-bottom:2px solid transparent; }
  #ftabs button.on { color:var(--pri); border-bottom-color:var(--pri); font-weight:700; background:var(--card); }
  #edwrap { flex:1; display:flex; min-height:0; position:relative; }
  #gutter { font: 13px/1.5 var(--mono); padding:.75rem .5rem .75rem .6rem; text-align:right;
    color:#b3bccb; user-select:none; overflow:hidden; border-right:1px solid var(--line);
    min-width:2.6em; white-space:pre; background:#fafbfd; }
  #edstack { position:relative; flex:1; min-width:0; }
  #hl, #src { position:absolute; inset:0; margin:0; padding:.75rem 1rem;
    font: 13px/1.5 var(--mono); white-space:pre; tab-size:4; }
  #hl { overflow:hidden; pointer-events:none; }
  #hl code { display:block; font:inherit; }
  #hl .cl { min-height:1.5em; }
  #src { border:0; resize:none; outline:none; background:transparent; overflow:auto;
    color:transparent; caret-color: var(--ink); }
  #src::selection { background: rgba(47,111,208,.22); }
  .tk-kw { color:#a626a4; font-weight:600; }
  .tk-ms { color:var(--pri); }
  .tk-mb { color:#0e8a7d; }
  .tk-un { color:#1a7f37; }
  .tk-num, .tk-pct { color:#b25f00; }
  .tk-cm { color:#8a95a6; font-style:italic; }
  .tk-dir { color:#8a95a6; font-weight:600; }
  .tk-sym { opacity:.7; }
  #hl .eline { background: var(--badbg); border-radius:3px; }
  #comp { position:absolute; z-index:9; background:var(--card); border:1px solid var(--line);
    border-radius:8px; box-shadow:0 6px 24px rgba(16,30,54,.18); font: 12px/1.6 var(--mono);
    max-height:14em; overflow:auto; min-width:16em; }
  #comp .ci { padding:.14rem .6rem; cursor:pointer; display:flex; gap:.8rem; }
  #comp .ci .ck { margin-left:auto; color:var(--mut); font: .72rem var(--sans); }
  #comp .ci.sel { background: var(--pri2); }
  #err { font: 12px/1.5 var(--mono); color: var(--bad); white-space: pre-wrap;
    padding:.45rem 1rem; border-top:1px solid var(--line); min-height:1.6rem; }
  #err.on { background: var(--badbg); font-weight:600; }
  #err.warn { color:var(--warn); background:var(--warnbg); font-weight:600; }

  /* ---- the grid (enterprise EPM grammar, portal-matched) ---- */
  #right { overflow:auto; min-height:0; background:var(--card); }
  #right.stale { opacity:.45; filter: grayscale(.6); transition: opacity .2s; }
  table { border-collapse: collapse; width: max-content; min-width:100%; }
  th, td { text-align:right; padding:.3rem .8rem; border-bottom:1px solid var(--line);
    white-space:nowrap; font-family:var(--mono); font-size:12.5px;
    font-variant-numeric: tabular-nums; }
  thead th { position:sticky; top:0; background:#fafbfd; z-index:2; color:var(--mut);
    font-family:var(--sans); font-size:.7rem; font-weight:600; text-transform:uppercase;
    letter-spacing:.5px; border-bottom:2px solid var(--line); }
  th:first-child, td:first-child { text-align:left; position:sticky; left:0;
    background:var(--card); z-index:1; max-width:230px; overflow:hidden; text-overflow:ellipsis;
    font-family:var(--sans); font-size:.84rem; }
  td:first-child { box-shadow: 2px 0 4px -2px rgba(16,30,54,.12); }
  tbody tr:hover td { box-shadow: inset 0 0 0 999px rgba(22,40,63,.035); }
  tbody tr:hover td:first-child { box-shadow: 2px 0 4px -2px rgba(16,30,54,.12),
    inset 0 0 0 999px rgba(22,40,63,.035); }
  tr.inp td { background: var(--amber); }
  tr.inp td:first-child { background: var(--card); color: var(--pri); font-weight:600; }
  td.neg { color: var(--bad); }
  td.chg { background: #d7e7ff; }
  td.out { opacity:.35; }
  td.dup { background: var(--okbg); } td.ddown { background: var(--badbg); }
  td.hl { outline:2px solid var(--pri); outline-offset:-2px; }
  td.torn { cursor: crosshair; }
  td.mname { cursor:pointer; }
  td input { font:inherit; width:7.5em; text-align:right; border:0;
    border-bottom:1px dashed var(--pri); background:rgba(47,111,208,.05);
    color:inherit; outline:none; padding:0; }
  td .band { display:block; font-size:.72em; color:var(--mut); }
  .unit { color:var(--mut); font-size:.72rem; margin-left:.45em; font-weight:400;
    font-family:var(--sans); }

  /* ---- status footer ---- */
  #foot { display:flex; gap:1.2rem; padding:.45rem 1.1rem; background:var(--card);
    border-top:1px solid var(--line); flex-wrap:wrap; align-items:baseline; font-size:.82rem; }
  #foot .lbl { color:var(--mut); font-size:.66rem; text-transform:uppercase;
    letter-spacing:.6px; margin-right:.5rem; }
  #scalars span { margin-right:.6rem; padding:.12rem .55rem; border:1px solid var(--line);
    border-radius:999px; background:#fafbfd; font-size:.78rem; }
  #scalars span b { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  #scalars span:hover { border-color: var(--pri); }
  #hint { color:var(--mut); font-size:.74rem; }
  #stats { margin-left:auto; color:var(--mut); font-size:.78rem; } #stats b { color:var(--ok); }

  /* ---- the model view: includes, architecture, roll-up, access ---- */
  body.view-model main { grid-template-columns: 1fr !important; }
  body.view-model #left, body.view-model #split, body.view-model #right { display:none; }
  #modelPane { display:none; overflow:auto; min-height:0; background:var(--bg); padding:1.1rem 1.3rem; }
  body.view-model #modelPane { display:block; }
  .mcard { background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:.9rem 1.1rem; margin-bottom:1rem; box-shadow:0 1px 2px rgba(16,30,54,.04); }
  .mcard h3 { margin:.1rem 0 .6rem; font-size:.74rem; color:var(--mut);
    text-transform:uppercase; letter-spacing:.8px; }
  .mgrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); gap:1rem; }
  .mgrid .mcard { margin-bottom:0; }
  .mover b { font-size:1rem; margin-right:.4rem; }
  .chip { display:inline-block; background:#eef1f6; color:#4a5668; border-radius:999px;
    padding:.08rem .55rem; font-size:.74rem; margin:.12rem .25rem .12rem 0; }
  .chip.amber { background:var(--amber); color:var(--warn); }
  .chip.roll { background:var(--pri2); color:var(--pri); font-weight:600; }
  .chip.all { background:#f3e8fd; color:#7b3ff2; font-weight:600; }
  .chip.okc { background:var(--okbg); color:var(--ok); } .chip.badc { background:var(--badbg); color:var(--bad); }
  .mnote { color:var(--mut); font-size:.78rem; margin:.15rem 0 .4rem; }
  .ftree ul { list-style:none; margin:.15rem 0 .15rem .55rem; padding-left:.9rem;
    border-left:1px dashed var(--line); }
  .ftree > ul { margin-left:0; padding-left:0; border-left:0; }
  .ftree li { padding:.14rem 0; }
  .ftree .fname { font-family:var(--mono); font-size:.8rem; color:var(--pri); }
  .ftree .fname.link { cursor:pointer; } .ftree .fname.link:hover { text-decoration:underline; }
  .dimrow { padding:.25rem 0; border-top:1px dashed var(--line); font-size:.85rem; }
  .dimrow:first-of-type { border-top:0; }
  .mtable { border-collapse:collapse; width:100%; }
  .mtable th, .mtable td { text-align:left; padding:.32rem .5rem; border-bottom:1px solid var(--line);
    font-family:var(--sans); font-size:.82rem; font-variant-numeric:normal; white-space:normal; position:static;
    background:transparent; box-shadow:none; max-width:none; }
  .mtable th { color:var(--mut); font-size:.7rem; text-transform:uppercase; letter-spacing:.5px; border-bottom:2px solid var(--line); }
  .mtable tr.meRow td { background:var(--pri2); }
  .dagwrap { overflow:auto; padding:.3rem 0; }
  #dag .edge { fill:none; stroke:#c9d4e5; stroke-width:1.2; }
  #dag .edge.hl { stroke:var(--pri); stroke-width:2; }
  #dag .node { cursor:pointer; }
  #dag .node rect { fill:#fff; stroke:var(--line); }
  #dag .node.input rect { fill:var(--amber); stroke:var(--amber2); }
  #dag .node.datain rect { fill:#eef7f0; stroke:#cbe6d3; }
  #dag .node.solve rect { fill:#f3e8fd; stroke:#e2cdfa; }
  #dag .node.assert.pass rect { fill:var(--okbg); stroke:#bfe3cb; }
  #dag .node.assert.fail rect { fill:var(--badbg); stroke:#f0c1bf; }
  #dag .node.sel rect { stroke:var(--pri); stroke-width:2; }
  #dag .node text { font:600 11px var(--sans); fill:var(--ink); }
  #dag .node text.u { font:9px var(--sans); fill:var(--mut); }
  #mdetail { margin-top:.5rem; }
  #mdetail .box { border-top:2px solid var(--line); padding-top:.5rem; font-size:.84rem; }
  #mdetail b.nm { font-family:var(--mono); font-size:.9rem; }
  #mdetail a { color:var(--pri); text-decoration:none; }

  /* ---- inspector & tornado cards ---- */
  #inspect, #tornado { position:fixed; right:1rem; bottom:3rem; background:var(--card);
    border:1px solid var(--line); border-radius:12px; padding:.8rem 1rem;
    box-shadow:0 12px 40px rgba(16,30,54,.22); z-index:5; }
  #tornado { max-width:420px; z-index:6; }
  #inspect { max-width:440px; max-height:60vh; overflow:auto; }
  #inspect h3 { margin:.15rem 0 .3rem; font-size:.92rem; font-family:var(--sans); }
  #inspect .crumb { font-size:.76rem; color:var(--mut); margin-bottom:.15rem; }
  #inspect .meta { font-size:.78rem; color:var(--mut); margin:.1rem 0; }
  #inspect .meta code { font-family:var(--mono); font-size:.95em; color:var(--ink); }
  #inspect .dep { display:flex; gap:.5rem; align-items:baseline; font-size:.8rem;
    padding:.14rem 0; border-top:1px dashed var(--line); }
  #inspect .dep .dv { margin-left:auto; font-weight:600; font-family:var(--mono);
    font-variant-numeric:tabular-nums; }
  #inspect .via { font-size:.68rem; background:var(--pri2); color:var(--pri);
    border-radius:999px; padding:.02rem .45em; font-weight:600; }
  #inspect a { color:var(--pri); text-decoration:none; }
  #inspect .close, #tornado .close { float:right; cursor:pointer; color:var(--mut); }
  #inspect .term { display:grid; grid-template-columns: 130px 1fr 110px; gap:.45rem;
    align-items:center; font-size:.76rem; margin:.12rem 0; }
  #inspect .term .tl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #inspect .ttrack { position:relative; height:9px; background:var(--dim); border-radius:5px; }
  #inspect .tbar { position:absolute; left:0; top:0; height:100%; background:var(--ok); border-radius:5px; }
  #inspect .tbar.neg { background:var(--bad); }
  #inspect .tv { text-align:right; white-space:nowrap; font-family:var(--mono);
    font-variant-numeric:tabular-nums; }
  #inspect .share { color:var(--mut); font-size:.85em; }
  #inspect button { margin-top:.45rem; }
  #tornado h3 { margin:.1rem 0 .5rem; font-size:.9rem; font-family:var(--sans); }
  #tornado .bar { display:grid; grid-template-columns: 150px 1fr; gap:.5rem; align-items:center;
    font-size:.78rem; margin:.15rem 0; }
  #tornado .track { position:relative; height:10px; background:var(--dim); border-radius:5px; }
  #tornado .dn, #tornado .up { position:absolute; top:0; height:100%; }
  #tornado .dn { background:var(--bad); right:50%; border-radius:5px 0 0 5px; }
  #tornado .up { background:var(--ok); left:50%; border-radius:0 5px 5px 0; }
</style>
</head>
<body>
<header>
  <div class="brand">Workbench<small>powered by fml</small></div>
  <select id="modelSel" title="Model"></select>
  <nav id="menubar">
    <span class="actions">
      <div class="menu">
        <button class="mbtn">File</button>
        <div class="mdrop">
          <button id="saveBtn" title="Save the active file to disk">Save to disk…<span class="mkey">⌘S</span></button>
          <span id="draftState" class="minfo"></span>
        </div>
      </div>
      <div class="menu">
        <button class="mbtn">Model</button>
        <div class="mdrop">
          <button id="simBtn" title="Monte Carlo over distribution inputs (500 trials)">Simulate uncertainty</button>
          <div class="msep"></div>
          <button id="addPeriodBtn" title="Extend the calendar by one period (full-range maps copy their last entry)">Add period</button>
          <button id="addMemberBtn" data-keep="1" title="Add a member to a dimension (arms inserted into every match)" style="display:none">Add member…</button>
          <span id="amForm" class="minfo" style="display:none"></span>
        </div>
      </div>
    </span>
    <div class="menu" id="scenMenu" style="display:none">
      <button class="mbtn" id="scenMenuLbl">Scenario</button>
      <div class="mdrop"><span id="scen"></span></div>
    </div>
    <div class="menu">
      <button class="mbtn">View</button>
      <div class="mdrop">
        <span class="views" id="views" title="Layout">
          <button data-v="code">Code</button>

<script type="module">
const MODELS = ["industrial_budget"];
const enc = new TextEncoder(), dec = new TextDecoder();

// (mint tokens with:  fml-server token alice)

// ---- multi-file state: main + any included files, with per-file drafts ----

}
function saveDraft() { saveDraftFor(activeFile); }
function updateDraftState() {

    ? 'draft <button id="revertBtn" title="Discard the draft and reload the file">revert</button>'
    : "";

  if (rb) rb.addEventListener("click", () => {
    localStorage.removeItem(draftKey());

}
function renderTabs() {

async function saveToDisk() {
  const text = fileTexts[activeFile] ?? document.getElementById("src").value;
  const name = activeFile || current + ".fml";
  if (window.showSaveFilePicker) {
    try {
      const h = await showSaveFilePicker({
        suggestedName: name,
        types: [{ description: "fml model", accept: { "text/plain": [".fml"] } }],
      });
      const w = await h.createWritable();
      await w.write(text);
      await w.close();

    } catch (e) {
      if (e.name === "AbortError") return; // user cancelled

}

function writeInput(str) {
  const bytes = enc.encode(str);
  const ptr = exports.fml_input_ptr(bytes.length);
  new Uint8Array(exports.memory.buffer, ptr, bytes.length).set(bytes);
}

}

}
function stats(r, us, what) {

function renderScenChips(r) {

  const names = ["Base", ...(r.scenarios || [])];
  activeScen = r.active || "Base";
  box.innerHTML = "";
  // The Scenario menu exists only when the model declares scenarios —
  // and only locally (scenario preview runs in the wasm session).
  const menu = document.getElementById("scenMenu");
  if (menu) menu.style.display = !SERVER && names.length > 1 ? "" : "none";
  const lbl = document.getElementById("scenMenuLbl");
  if (lbl) lbl.textContent = activeScen === "Base" ? "Scenario" : `Scenario · ${activeScen}`;
  if (names.length === 1) return;
  for (const n of names) {
    const b = document.createElement("button");
    b.textContent = n;
    b.classList.toggle("on", n === activeScen);
    b.addEventListener("click", () => {
      writeInput(n);
      const t0 = performance.now();
      if (exports.fml_scenario() === 0) {
        const r2 = readResult();
        stats(r2, (performance.now() - t0) * 1000, n === "Base" ? "Base" : `scenario ${n}`);
        render(r2);

        setErr(readResult().error);

  }
}
// Adopt new per-file sources (from a patch or a structural edit).
function adoptFiles(files) {
  (files || []).forEach((f, i) => {
    const key = i === 0 ? mainFile() : f.name;
    if (fileTexts[key] !== f.src) {
      fileTexts[key] = f.src;
      saveDraftFor(key);
      if (key === activeFile) {
        const top = srcBox.scrollTop;
        srcBox.value = f.src;
        srcBox.scrollTop = top;
        renderHl();
      }
    }
  });
}
// Apply a successful fml_patch result: sync per-file sources + rerender.
function syncPatchResult(r2, us, what) {
  stats(r2, us, what);
  adoptFiles(r2.files);
  renderTabs();
  render(r2);
}
function render(r) {
  lastState = r;

  const scen = r.active && r.active !== "Base" ? r.active : null;
  banner.style.display = scen ? "flex" : "none";
  if (scen) {
    banner.innerHTML = `viewing scenario <b>${scen}</b> — cells colored vs Base (hover for Base values)
      <button id="backBase">back to Base</button>`;

      writeInput("Base");

  renderScenChips(r);

    const nameData = SERVER ? "" : ` class="mname" data-nkey="${s.key}" data-nmember="${s.member || ""}" data-nt="${s.range[0]}"`;
    html += `<tr class="${cls}"><td title="${s.name}"${nameData}>${s.name}<span class="unit">${s.unit}</span></td>`;

      let editable = !inScen && (s.edit === "all" ? inRange : Array.isArray(s.edit) && s.edit.includes(t));

        && (!window.clientCanEdit || window.clientCanEdit());

      } else if (inScen) {

      } else if (simBands && simBands[s.name] && inRange && !s.input) {

          ? `<span class="band">${fmt(b10)} … ${fmt(b90)}</span>` : "";
        html += `<td class="${b50 !== null && b50 < 0 ? "neg" : ""}" title="p10 ${fmt(b10)} · p50 ${fmt(b50)} · p90 ${fmt(b90)}">${fmt(b50)}${band}</td>`;

          name: inp.dataset.key, member: inp.dataset.member || "",
          period: inp.dataset.t, value: String(v) }) })
          .then(r => r.json())
          .then(async r => {

      writeInput(inp.dataset.member ? inp.dataset.key + "|" + inp.dataset.member : inp.dataset.key);
      const t0 = performance.now();

// ---- the code editor: lexer-driven highlighting, error lines, completion ----
const hlcode = document.getElementById("hlcode");
const gutterEl = document.getElementById("gutter");
let lastErrors = [];   // [{file, line, msg}] from the last load
const escHtml = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function activeErrLines() {
  const out = new Set();
  for (const e of lastErrors) {
    const key = !e.file || e.file === "model" || e.file === "main" ? mainFile() : e.file;
    if (key === activeFile && e.line > 0) out.add(e.line);
  }
  return out;
}
function renderHl() {
  const text = srcBox.value;
  const errs = activeErrLines();
  const lines = [];
  let cur = "";
  const pushText = (txt, cls) => {
    const parts = txt.split("\n");
    parts.forEach((part, i) => {
      if (part) cur += cls ? `<span class="tk-${cls}">${escHtml(part)}</span>` : escHtml(part);
      if (i < parts.length - 1) { lines.push(cur); cur = ""; }
    });
  };

  // source stays visible; semantic coloring needs the local lexer.
  if (exports) writeInput(text);
  if (exports && exports.fml_tokens() === 0) {
    const bytes = enc.encode(text);
    for (const [k, s0, e0] of readResult().toks) {
      pushText(dec.decode(bytes.subarray(s0, e0)), k === "ws" || k === "id" ? "" : k);
    }
  } else {
    pushText(text, "");
  }
  lines.push(cur);
  hlcode.innerHTML = lines
    .map((l, i) => `<div class="cl${errs.has(i + 1) ? " eline" : ""}">${l || "&#8203;"}</div>`)
    .join("");

}
function syncScroll() {
  const hl = document.getElementById("hl");
  hl.scrollTop = srcBox.scrollTop;
  hl.scrollLeft = srcBox.scrollLeft;
  gutterEl.scrollTop = srcBox.scrollTop;
}

// ---- completion popup ----
const compEl = document.getElementById("comp");
let compItems = [], compSel = 0;
function currentWord() {
  const pos = srcBox.selectionStart;
  const text = srcBox.value;
  let s0 = pos;
  while (s0 > 0 && /[A-Za-z0-9_]/.test(text[s0 - 1])) s0--;
  return { s0, pos, word: text.slice(s0, pos) };
}
function hideComp() { compEl.style.display = "none"; compItems = []; }
function maybeComplete(force) {
  if (!exports || srcBox.readOnly) return;
  const { word } = currentWord();
  if (!force && (word.length < 2 || /^[0-9]/.test(word))) { hideComp(); return; }
  if (exports.fml_complete() !== 0) return;
  const items = readResult().items.filter(([n]) => n.startsWith(word) && n !== word);
  if (!items.length) { hideComp(); return; }
  compItems = items.slice(0, 12);
  compSel = 0;
  renderComp();
  positionComp();
}
function renderComp() {
  compEl.innerHTML = compItems
    .map(([n, k, d], i) =>
      `<div class="ci${i === compSel ? " sel" : ""}" data-i="${i}">${escHtml(n)}<span class="ck">${k}${d ? " · " + escHtml(d) : ""}</span></div>`)
    .join("");

    el.addEventListener("mousedown", e => { e.preventDefault(); compSel = Number(el.dataset.i); acceptComp(); }));
}
function positionComp() {

  mirror.style.cssText = `position:absolute;visibility:hidden;white-space:pre;font:${cs.font};line-height:${cs.lineHeight};padding:${cs.padding};width:${srcBox.clientWidth}px;`;
  const upto = srcBox.value.slice(0, srcBox.selectionStart);
  mirror.textContent = upto;
  const marker = document.createElement("span");
  marker.textContent = "\u200b";
  mirror.appendChild(marker);
  document.getElementById("edstack").appendChild(mirror);
  const top = marker.offsetTop - srcBox.scrollTop + 20;
  const left = Math.min(marker.offsetLeft - srcBox.scrollLeft, srcBox.clientWidth - 200);
  mirror.remove();
  compEl.style.top = `${Math.max(0, top)}px`;
  compEl.style.left = `${Math.max(0, left)}px`;
}
function acceptComp() {
  if (!compItems.length) return;
  const [name] = compItems[compSel];
  const { s0, pos } = currentWord();
  srcBox.setRangeText(name, s0, pos, "end");

}

function setErr(msg) {
  const e = document.getElementById("err");
  e.textContent = msg;
  e.classList.toggle("on", !!msg);
  e.classList.remove("warn");
  // A failed compile means the grid shows the LAST GOOD model — dim it.
  document.getElementById("right").classList.toggle("stale", !!msg);
}
// A salvaged compile: broken declarations skipped, the rest is LIVE — the
// grid is current, so no dimming; amber, not red.
function setWarn(msg) {
  const e = document.getElementById("err");
  e.textContent = msg;
  e.classList.remove("on");
  e.classList.add("warn");
  document.getElementById("right").classList.remove("stale");
}
// Compile the multi-file model: provide every known file to the wasm side,
// load the main file, and fetch any include the model asks for on demand.
async function loadModel(what) {
  for (let tries = 0; tries < 12; tries++) {
    for (const [n, t] of Object.entries(fileTexts)) {
      if (n === mainFile()) continue;
      writeInput(n + "\n" + t);
      exports.fml_file();
    }
    writeInput(fileTexts[mainFile()]);
    const t0 = performance.now();
    const rc = exports.fml_load();
    const r = readResult();
    if (rc === 0) {
      loadedOk = true;
      lastErrors = r.errors || [];
      if (r.warning) setWarn(r.warning); else setErr("");
      prev = {};
      baseVals = {};
      activeScen = "Base";
      let label = r.warning ? what + " (salvaged)" : what;
      if (r.reload) {
        if (r.reload.reused) {
          label += " — no semantic change, analysis reused";
        } else {
          label += ` — reanalyzed (${r.reload.changed.join(", ") || "structure"})`;
          if (r.reload.affected > 0) label += ` → ${r.reload.affected} affected`;
          if (r.reload.hits > 0) label += ` · ${r.reload.hits} query hits`;
        }
      }
      stats(r, (performance.now() - t0) * 1000, label);
      renderTabs();
      render(r);
      renderHl();
      return;
    }
    const miss = /(?:include|data file) "([^"]+)" is not loaded/.exec(r.error || "");
    if (!miss) {
      lastErrors = r.errors || [];
      setErr(r.error + "   (grid shows the last valid model)");
      loadedOk = false;
      renderTabs();
      renderHl();
      return;
    }
    const resp = await fetch(miss[1] + "?v=" + Date.now());
    if (!resp.ok) {
      setErr(`cannot fetch "${miss[1]}" (HTTP ${resp.status})`);
      loadedOk = false;
      return;
    }
    diskTexts[miss[1]] = await resp.text();
    const d = localStorage.getItem(draftKey(miss[1]));
    fileTexts[miss[1]] = d !== null ? d : diskTexts[miss[1]];
  }
  setErr("include resolution did not settle in 12 rounds");
}

let lastSeq = -1;
async function refreshFromServer(us, what) {
  const r = await (await fetch(SERVER + "/state" + window.clientQs())).json();
  lastSeq = r.seq;
  if (window.refreshProcFromState) window.refreshProcFromState(r);
  stats(r, us || 0, what || "server state");
  render(r);
  const m = await (await fetch(SERVER + "/model" + window.clientQs())).json();
  const box = document.getElementById("src");
  if (m.src !== box.value) { const top = box.scrollTop; box.value = m.src; box.scrollTop = top; if (typeof renderHl === "function") renderHl(); }
}
// ---- the model view: include hierarchy, architecture DAG, roll-up, access ----
const escM = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
// Single-file models carry the internal name "main"/"model" — show the real one.
const fileDisp = f => !SERVER && (f === "main" || f === "model") ? mainFile() : f;
let modelInfoReq = 0;
async function fetchModelInfo() {
  if (SERVER) {
    if (!window.clientQs) return null; // client boot not finished yet
    try { return await (await fetch(SERVER + "/info" + window.clientQs())).json(); }
    catch { return null; }
  }
  if (!exports || !loadedOk) return null;
  if (exports.fml_model_info() !== 0) return null;
  return readResult();
}
function dagSvg(info) {
  const M = info.measures, byName = {};
  M.forEach(m => byName[m.name] = m);
  // Layer = longest path from the inputs; solve cycles settle on the
  // layer where the cycle is entered (the guard breaks recursion).
  const depth = {}, onstack = new Set();
  const d = n => {
    if (depth[n] !== undefined) return depth[n];
    if (onstack.has(n)) return 0;
    const m = byName[n];
    if (!m) return 0;
    onstack.add(n);
    const v = m.input ? 0 : 1 + m.refs.reduce((a, r) => Math.max(a, d(r)), 0);
    onstack.delete(n);
    depth[n] = v;
    return v;
  };
  M.forEach(m => d(m.name));
  let maxD = Math.max(0, ...M.map(m => depth[m.name]));
  const nodes = M.map(m => ({ id: m.name, m, d: depth[m.name],
    kind: m.data ? "datain" : m.input ? "input" : m.solve ? "solve" : "calc", refs: m.refs }));
  if (info.asserts.length) {
    maxD += 1;
    for (const a of info.asserts) nodes.push({ id: a.name, d: maxD, kind: "assert", refs: a.refs });
  }
  const passMap = {};
  (lastState?.asserts || []).forEach(([n, ok]) => passMap[n] = ok);
  const cols = Array.from({ length: maxD + 1 }, () => []);
  nodes.forEach(n => cols[n.d].push(n));
  const rowH = 32, gapY = 10, colGap = 64, padX = 12;
  let x = 8;
  const pos = {};
  cols.forEach(col => {
    const w = Math.max(96, ...col.map(n => n.id.length * 6.7 + 2 * padX));
    col.forEach((n, j) => { pos[n.id] = { x, y: 10 + j * (rowH + gapY), w }; });
    x += w + colGap;
  });
  const H = Math.max(1, ...cols.map(c => c.length)) * (rowH + gapY) + 18;
  const W = x - colGap + 16;
  let edges = "", nds = "";
  for (const n of nodes) {
    for (const r of n.refs) {
      const p = pos[r], q = pos[n.id];
      if (!p || !q) continue;
      const x1 = p.x + p.w, y1 = p.y + rowH / 2, x2 = q.x, y2 = q.y + rowH / 2;
      edges += `<path class="edge" data-from="${escM(r)}" data-to="${escM(n.id)}"
        d="M${x1},${y1} C${x1 + colGap / 2},${y1} ${x2 - colGap / 2},${y2} ${x2},${y2}"/>`;
    }
  }
  for (const n of nodes) {
    const p = pos[n.id];
    const cls = n.kind + (n.kind === "assert" ? (passMap[n.id] === false ? " fail" : " pass") : "");
    const sub = n.kind === "assert" ? "assert"
      : [n.m.unit, n.m.solve ? "solve" : "", n.m.dist ? "~dist" : "",
         n.m.data ? "data" : ""].filter(Boolean).join(" · ");
    nds += `<g class="node ${cls}" data-n="${escM(n.id)}" transform="translate(${p.x},${p.y})">
      <rect width="${p.w}" height="${rowH}" rx="7"/>
      <text x="${padX}" y="13">${escM(n.id)}</text>
      <text class="u" x="${padX}" y="25">${escM(sub)}</text></g>`;
  }
  return `<svg id="dag" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${edges}${nds}</svg>`;
}

  }
}
// Adjustable levers for goal-seek: every literal-editable input cell,
// plus scalar inputs (distribution inputs fall back to runtime-only apply).
function leverOptions() {
  const opts = [];
  for (const s of (lastState?.series || [])) {
    if (!s.input) continue;
    if (s.edit === "all") {
      opts.push({ key: s.key, member: s.member || "", t: -1, label: cellDisplay(s.key, s.member) + " (all periods)" });
    } else if (Array.isArray(s.edit)) {
      for (const t of s.edit) {
        opts.push({ key: s.key, member: s.member || "", t, label: cellDisplay(s.key, s.member) + " @ " + lastState.periods[t] });
      }
    }
  }
  for (const sc of (lastState?.scalars || [])) {
    if (sc.input) opts.push({ key: sc.name, member: "", t: -1, label: sc.name });
  }
  return opts;
}
function gotoDef(file, line) {
  const key = file === "main" || file === "model" ? mainFile() : file;
  if (fileTexts[key] !== undefined && key !== activeFile) {
    activeFile = key;
    srcBox.value = fileTexts[key];
    renderTabs();
    updateDraftState();
    renderHl();
  }
  const lh = parseFloat(getComputedStyle(srcBox).lineHeight) || 19;
  srcBox.scrollTop = Math.max(0, (line - 2) * lh);
  const lines = srcBox.value.split("\n");
  const start = lines.slice(0, line - 1).join("\n").length + (line > 1 ? 1 : 0);
  srcBox.setSelectionRange(start, start + (lines[line - 1] || "").length);
  srcBox.focus();
}
function inspect(key, member, t, drill) {
  writeInput(member ? key + "|" + member : key);
  if (exports.fml_explain(t === null ? -1 : Number(t)) !== 0) { setErr(readResult().error); return; }
  const ex = readResult();
  if (!drill) inspectStack = [];
  inspectStack.push(ex);
  renderInspect();
}
function renderInspect() {
  document.getElementById("tornado")?.remove();
  document.getElementById("inspect")?.remove();
  const ex = inspectStack[inspectStack.length - 1];
  const div = document.createElement("div");
  div.id = "inspect";
  const crumb = inspectStack.length > 1
    ? '<div class="crumb">' + inspectStack.map((s, i) =>
        i === inspectStack.length - 1
          ? `<b>${cellDisplay(s.name, s.member)}</b>`
          : `<a href="#" data-i="${i}">${cellDisplay(s.name, s.member)}</a>`).join(" › ") + "</div>"
    : "";
  const period = ex.period === null ? "" : " @ " + ex.label;
  const depRows = ex.deps.map((d, i) => {
    const via = d.via ? `<span class="via">${d.via}</span>` : "";
    const at = d.t !== null ? " @ " + d.label : (d.label ? " @ " + d.label : "");
    const tag = d.input ? ' <span class="via">input</span>' : "";
    return `<div class="dep">${via}<a href="#" data-d="${i}">${cellDisplay(d.name, d.member)}${at}</a>${tag}<span class="dv">${fmt(d.value)}</span></div>`;
  }).join("") || '<div class="dep" style="opacity:.6">no dependencies — a source value</div>';
  // Contribution bars: EXACT additive terms (they sum to the value).
  let termRows = "";
  if (ex.terms && ex.terms.length > 1) {
    let terms = ex.terms, rest = null;
    if (terms.length > 14) {
      const shown = [...terms].sort((a, b) => Math.abs(b.value) - Math.abs(a.value)).slice(0, 12);
      const set = new Set(shown);
      rest = { label: `… ${terms.length - 12} more`, value: terms.filter(t => !set.has(t)).reduce((s, t) => s + t.value, 0), name: null };
      terms = shown;
    }
    const maxAbs = Math.max(...ex.terms.map(t => Math.abs(t.value)), 1e-12);
    const bar = (t, i) => {
      const w = (Math.abs(t.value) / maxAbs * 100).toFixed(1);
      const share = ex.value ? ` <span class="share">${(t.value / ex.value * 100).toFixed(1)}%</span>` : "";
      const lbl = t.name ? `<a href="#" class="tdrill" data-n="${t.name}" data-m="${t.member || ""}" data-t="${t.t === null ? "" : t.t}">${t.label}</a>` : t.label;
      return `<div class="term"><span class="tl" title="${t.label}">${lbl}</span>
        <span class="ttrack"><span class="tbar${t.value < 0 ? " neg" : ""}" style="width:${w}%"></span></span>
        <span class="tv">${fmt(t.value)}${share}</span></div>`;
    };
    termRows = `<div class="meta" style="margin-top:.35rem"><b>contribution</b> — exact terms, sum = value</div>`
      + terms.map(bar).join("") + (rest ? bar(rest) : "");
  }
  div.innerHTML = `<span class="close">✕</span>${crumb}
    <h3>${cellDisplay(ex.name, ex.member)}${period} = ${fmt(ex.value)} <span class="unit">${ex.unit}</span></h3>
    <div class="meta">defined in <a href="#" id="goDef">${ex.file === "main" || ex.file === "model" ? mainFile() : ex.file}:${ex.line}</a>${ex.arm ? " · " + ex.arm : ""}</div>
    ${ex.note ? `<div class="meta">${ex.note}</div>` : ""}
    ${ex.body !== undefined ? `<div class="meta">= <code>${ex.body.length > 90 ? ex.body.slice(0, 90) + "…" : ex.body}</code></div>` : ""}
    ${termRows}
    ${depRows}
    ${!ex.input && ex.period !== null ? '<button id="tornBtn">tornado ±10%</button> ' : ""}${!ex.input ? '<button id="gsBtn">goal seek…</button> ' : ""}<button id="rnBtn">rename…</button>${ex.body !== undefined ? ' <button id="fxBtn">edit formula…</button>' : ""}
    <div id="gsForm"></div><div id="rnForm"></div><div id="fxForm"></div>`;
  document.body.appendChild(div);
  div.querySelector(".close").addEventListener("click", () => {
    div.remove();
    document.getElementById("tornado")?.remove();
    clearHl();
    inspectStack = [];
  });
  div.querySelectorAll("a[data-i]").forEach(a => a.addEventListener("click", e => {
    e.preventDefault();
    inspectStack = inspectStack.slice(0, Number(a.dataset.i) + 1);
    renderInspect();
  }));
  div.querySelectorAll("a[data-d]").forEach(a => a.addEventListener("click", e => {
    e.preventDefault();
    const d = ex.deps[Number(a.dataset.d)];
    inspect(d.name, d.member || "", d.t, true);
  }));
  div.querySelectorAll("a.tdrill").forEach(a => a.addEventListener("click", e => {
    e.preventDefault();
    inspect(a.dataset.n, a.dataset.m, a.dataset.t === "" ? null : Number(a.dataset.t), true);
  }));
  div.querySelector("#goDef").addEventListener("click", e => {
    e.preventDefault();
    gotoDef(ex.file, ex.line);
  });
  const gs = div.querySelector("#gsBtn");
  if (gs) gs.addEventListener("click", () => {
    const opts = leverOptions();
    if (!opts.length) { setErr("no adjustable inputs to seek with"); return; }
    const form = div.querySelector("#gsForm");
    form.innerHTML = `<div class="meta" style="margin-top:.4rem">target
      <input id="gsTarget" style="width:6em;font:inherit"> via
      <select id="gsLever" style="font:inherit">${opts.map((o, i) => `<option value="${i}">${o.label}</option>`).join("")}</select>
      <button id="gsGo">solve</button></div><div id="gsOut" class="meta"></div>`;
    form.querySelector("#gsTarget").focus();
    form.querySelector("#gsGo").addEventListener("click", () => {
      const target = Number(form.querySelector("#gsTarget").value);
      if (!Number.isFinite(target)) return;
      const o = opts[Number(form.querySelector("#gsLever").value)];
      writeInput(`${o.key}|${o.member}|${ex.name}|${ex.member || ""}`);
      const t0 = performance.now();
      const rc = exports.fml_goalseek(o.t, ex.period === null ? -1 : ex.period, target);
      const r = readResult();
      const out = form.querySelector("#gsOut");
      if (rc !== 0) { out.textContent = r.error; return; }
      out.innerHTML = `${o.label} = <b>${fmt(r.value)}</b> → ${cellDisplay(ex.name, ex.member)} = ${fmt(r.achieved)}
        <small style="opacity:.6">(${r.iterations} evals, ${((performance.now() - t0) * 1000).toFixed(0)} µs)</small>
        <button id="gsApply">apply</button>`;
      out.querySelector("#gsApply").addEventListener("click", () => {
        writeInput(o.member ? o.key + "|" + o.member : o.key);
        const t1 = performance.now();
        if (exports.fml_patch(o.t, r.value) === 0) {
          syncPatchResult(readResult(), (performance.now() - t1) * 1000, "goal-seek applied (grid→text)");
        } else {
          // Not literal-editable (e.g. a distribution input): runtime only.
          writeInput(o.key);
          exports.fml_set(o.t, r.value);
          if (exports.fml_recalc() === 0) {
            const r2 = readResult();
            stats(r2, (performance.now() - t1) * 1000, "goal-seek applied (runtime only)");
            render(r2);
          }
        }
        document.getElementById("inspect")?.remove();
        clearHl();
        inspectStack = [];
      });
    });
  });
  div.querySelector("#rnBtn").addEventListener("click", () => {
    const form = div.querySelector("#rnForm");
    form.innerHTML = `<div class="meta" style="margin-top:.4rem">rename to
      <input id="rnNew" style="width:10em;font:inherit" value="${ex.name}"> <button id="rnGo">apply everywhere</button>
      <div id="rnOut" class="meta"></div></div>`;
    const inp = form.querySelector("#rnNew");
    inp.focus();
    inp.select();
    form.querySelector("#rnGo").addEventListener("click", () => {
      const next = inp.value.trim();
      if (!next || next === ex.name) return;
      writeInput(ex.name + "|" + next);
      if (exports.fml_rename() !== 0) {
        form.querySelector("#rnOut").textContent = readResult().error;
        return;
      }
      adoptFiles(readResult().files);
      document.getElementById("inspect")?.remove();
      clearHl();
      inspectStack = [];
      loadModel(`renamed ${ex.name} → ${next}`);
    });
  });
  const fx = div.querySelector("#fxBtn");
  if (fx) fx.addEventListener("click", () => {
    const form = div.querySelector("#fxForm");
    form.innerHTML = `<div class="meta" style="margin-top:.4rem">
      <textarea id="fxBody" rows="3" style="width:100%;font:inherit">${ex.body}</textarea>
      <button id="fxGo">apply</button> <span id="fxOut"></span></div>`;
    const ta = form.querySelector("#fxBody");
    ta.focus();
    form.querySelector("#fxGo").addEventListener("click", () => {
      const body = ta.value.trim();
      if (!body || body === ex.body) return;
      writeInput(ex.name + "|" + body);
      if (exports.fml_replace_formula() !== 0) {
        form.querySelector("#fxOut").textContent = readResult().error;
        return;
      }
      adoptFiles(readResult().files);
      document.getElementById("inspect")?.remove();
      clearHl();
      inspectStack = [];
      loadModel(`formula of ${ex.name} changed`);
    });
  });
  const tb = div.querySelector("#tornBtn");
  if (tb) tb.addEventListener("click", () => {
    writeInput(ex.member ? ex.name + "|" + ex.member : ex.name);
    const t0 = performance.now();
    if (exports.fml_tornado(ex.period, 0.10) !== 0) { setErr(readResult().error); return; }
    showTornado(cellDisplay(ex.name, ex.member) + " @ " + ex.label, readResult().bars,
      (performance.now() - t0) * 1000);
  });
  highlightDeps(ex.deps);
}
function showTornado(title, bars, us) {
  document.getElementById("tornado")?.remove();
  const div = document.createElement("div");
  div.id = "tornado";
  const maxAbs = Math.max(...bars.map(b => Math.max(Math.abs(b[1]), Math.abs(b[2]))), 1e-12);
  div.innerHTML = `<span class="close" onclick="this.parentNode.remove()">✕</span>
    <h3>tornado: ${title} <small style="opacity:.5">(inputs ±10%, ${us.toFixed(0)} µs)</small></h3>` +
    bars.map(([label, dn, up]) => {
      const w = v => (Math.abs(v) / maxAbs * 50).toFixed(1);
      return `<div class="bar"><span title="${label}">${label}</span>
        <span class="track">
          <span class="dn" style="width:${w(dn)}%"></span>
          <span class="up" style="width:${w(up)}%"></span>
        </span></div>`;
    }).join("");
  document.body.appendChild(div);
}

const { instance } = await WebAssembly.instantiate(
  await (await fetch("fml.wasm?v=" + Date.now())).arrayBuffer(), {});
exports = instance.exports;

async function switchModel(name) {
  current = name;
  document.getElementById("modelSel").value = name;
  document.title = `fml · ${name}`;
  fileTexts = {};
  diskTexts = {};
  activeFile = mainFile();
  diskTexts[activeFile] = await (await fetch(name + ".fml?v=" + Date.now())).text();
  const draft = localStorage.getItem(draftKey());
  fileTexts[activeFile] = draft !== null ? draft : diskTexts[activeFile];
  srcBox.value = fileTexts[activeFile];
  updateDraftState();
  renderHl();
  await loadModel(draft !== null ? "draft restored" : "compile+run");
}
const msel = document.getElementById("modelSel");
for (const m of MODELS) {
  const o = document.createElement("option");
  o.value = o.textContent = m;
  msel.appendChild(o);
}
msel.addEventListener("change", () => switchModel(msel.value));

// live text editing: debounced full recompile
let timer = null;
srcBox.addEventListener("input", () => {
  renderHl();
  maybeComplete(false);
  clearTimeout(timer);
  timer = setTimeout(() => {
    fileTexts[activeFile] = srcBox.value;
    saveDraft();
    loadModel("recompile");
  }, 350);
});
srcBox.addEventListener("scroll", syncScroll);
srcBox.addEventListener("keydown", e => {
  if (compEl.style.display !== "none") {
    if (e.key === "ArrowDown") { e.preventDefault(); compSel = (compSel + 1) % compItems.length; renderComp(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); compSel = (compSel + compItems.length - 1) % compItems.length; renderComp(); return; }
    if (e.key === "Tab" || e.key === "Enter") { e.preventDefault(); acceptComp(); return; }
    if (e.key === "Escape") { hideComp(); return; }
  }
  if (e.key === " " && e.ctrlKey) { e.preventDefault(); maybeComplete(true); }
});
srcBox.addEventListener("blur", () => setTimeout(hideComp, 150));
document.getElementById("saveBtn").addEventListener("click", saveToDisk);
document.getElementById("addPeriodBtn").addEventListener("click", () => {
  if (SERVER || !loadedOk) return;
  if (exports.fml_add_period() !== 0) { setErr(readResult().error); return; }
  const r = readResult();
  adoptFiles(r.files);
  loadModel("added " + r.label);
});
document.getElementById("addMemberBtn").addEventListener("click", () => {
  if (SERVER || !loadedOk || !lastState?.dims?.length) return;
  const form = document.getElementById("amForm");
  if (form.style.display !== "none") { form.style.display = "none"; return; }
  const dims = lastState.dims;
  form.innerHTML = (dims.length > 1
      ? `<select id="amDim" style="font:inherit">${dims.map(d => `<option>${d.name}</option>`).join("")}</select> `
      : "")
    + `<input id="amName" placeholder="Member" style="width:7em;font:inherit">
       <input id="amDef" placeholder="default" value="0" style="width:4em;font:inherit">
       <button id="amGo">add</button>`;
  form.style.display = "";
  document.getElementById("amName").focus();
  document.getElementById("amGo").addEventListener("click", () => {
    const dim = dims.length > 1 ? document.getElementById("amDim").value : dims[0].name;
    const name = document.getElementById("amName").value.trim();
    const def = document.getElementById("amDef").value.trim() || "0";
    if (!name) return;
    writeInput(`${dim}|${name}|${def}`);
    if (exports.fml_add_member() !== 0) { setErr(readResult().error); return; }
    adoptFiles(readResult().files);
    form.style.display = "none";
    loadModel(`added ${dim}:${name}`);
  });
});
document.getElementById("simBtn").addEventListener("click", () => {
  if (SERVER) { setErr("simulate runs in local mode"); return; }
  const btn = document.getElementById("simBtn");
  if (simBands) {                        // exit sim mode
    simBands = null;
    btn.classList.remove("on");
    loadModel("back to deterministic");
    return;
  }
  const t0 = performance.now();
  if (exports.fml_simulate(500) !== 0) { setErr(readResult().error); return; }
  const r = readResult();
  simBands = {};
  for (const c of r.cells) if (c.series) simBands[c.name] = c.bands;
  btn.classList.add("on");
  document.getElementById("stats").innerHTML =
    `<b>simulated n=${r.trials}</b> · ${(performance.now() - t0).toFixed(0)} ms · cells show p50 with p10…p90`;
  // re-render current grid with bands (reuse last full state)
  writeInput("Base"); exports.fml_scenario(); render(readResult());
});
window.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "s") {
    e.preventDefault();
    saveToDisk();
  }
  if (e.key === "Escape") {
    document.getElementById("inspect")?.remove();
    document.getElementById("tornado")?.remove();
    clearHl();
    inspectStack = [];
    hideComp();
  }
});
await switchModel("industrial_budget");
</script>
