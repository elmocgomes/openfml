<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fml workbench</title>
<style>
  :root { color-scheme: light dark;
          --edge: rgba(128,128,128,.25); --dim: rgba(128,128,128,.12);
          --accent: #2a7dd1; --ok: #2a9d3a; --bad: #d33; }
  * { box-sizing: border-box; }
  body { font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
         margin: 0; height: 100vh; display: flex; flex-direction: column; }
  header { display:flex; align-items:center; gap:.7rem; padding:.45rem 1rem;
           border-bottom:1px solid var(--edge); flex-wrap:wrap; row-gap:.3rem; }
  header h1 { font-size:1rem; margin:0; letter-spacing:.5px; }
  #modelSel { font:inherit; padding:.2rem .4rem; border:1px solid var(--edge);
    background:transparent; color:inherit; border-radius:6px; max-width:11em; }
  header .actions { display:flex; gap:.35rem; align-items:center; padding-left:.5rem;
    border-left:1px solid var(--edge); }
  header .views { margin-left:auto; display:flex; }
  header .views button { font:inherit; font-size:.8em; padding:.15rem .5rem; cursor:pointer;
    border:1px solid var(--edge); background:transparent; opacity:.6; }
  header .views button:first-child { border-radius:6px 0 0 6px; }
  header .views button:last-child { border-radius:0 6px 6px 0; }
  header .views button.on { opacity:1; border-color:var(--accent); color:var(--accent); }
  #asserts { display:flex; gap:.35rem; }
  #asserts .pass, #asserts .fail { padding:.12rem .55rem; border-radius:10px; font-size:.82em; }
  #asserts .pass { background: rgba(42,157,58,.12); border:1px solid rgba(42,157,58,.4); }
  #asserts .fail { background: rgba(221,51,51,.15); border:1px solid rgba(221,51,51,.55);
    font-weight:700; animation: throb 1.2s ease-in-out infinite; }
  @keyframes throb { 50% { background: rgba(221,51,51,.3); } }
  #scenBanner { padding:.3rem 1rem; background: rgba(184,134,11,.12); color:#b8860b;
    border-bottom:1px solid var(--edge); font-weight:600; display:flex; gap:1rem; align-items:center; }
  #procBanner { padding:.3rem 1rem; background: rgba(42,125,209,.08);
    border-bottom:1px solid var(--edge); display:flex; gap:.8rem; align-items:center; flex-wrap:wrap; }
  #procBanner.locked { background: rgba(221,51,51,.1); }
  #procBanner .tag { border:1px solid var(--edge); border-radius:10px; padding:.05rem .5rem; font-size:.85em; }
  #procBanner .tag.sub { border-color:#b8860b; color:#b8860b; }
  #procBanner button { font:inherit; font-size:.85em; border:1px solid var(--edge); background:transparent;
    border-radius:6px; padding:.1rem .55rem; cursor:pointer; }
  #scenBanner button { font:inherit; font-size:.85em; border:1px solid currentColor; color:inherit;
    background:transparent; border-radius:5px; padding:.05rem .5rem; cursor:pointer; }
  #split { cursor: col-resize; background: transparent; position:relative; }
  #split::after { content:""; position:absolute; inset:0 2px; background: var(--edge); }
  #split:hover::after { background: var(--accent); }
  #hint { opacity:.4; font-size:.85em; }
  #scen { margin-left:0; }
  #scen button { font:inherit; padding:.15rem .55rem; margin-left:.3rem; border:1px solid var(--edge);
    background:transparent; border-radius:10px; cursor:pointer; opacity:.85; }
  #scen button.on { border-color:#b8860b; color:#b8860b; font-weight:600; }
  header .actions button { font:inherit; padding:.15rem .55rem; border:1px solid var(--edge);
    background:transparent; border-radius:10px; cursor:pointer; }
  #ftabs { display:flex; gap:.3rem; padding:.35rem .75rem 0; flex-wrap:wrap; }
  #ftabs button { font:inherit; font-size:.85em; padding:.12rem .5rem; border:1px solid var(--edge);
    border-bottom:0; background:transparent; border-radius:6px 6px 0 0; cursor:pointer; opacity:.7; }
  #ftabs button.on { border-color: var(--accent); color: var(--accent); opacity:1; font-weight:600; }
  #draftState { font-size:.85em; opacity:.7; margin-left:.4rem; }
  #draftState button { border:none; text-decoration:underline; padding:0; margin-left:.3rem; }
  td.dup { background: rgba(42,157,58,.18); } td.ddown { background: rgba(221,51,51,.14); }
  #stats { margin-left:auto; opacity:.85; } #stats b { color: var(--ok); }
  main { flex:1; display:grid; grid-template-columns: minmax(280px, 34%) 6px 1fr; min-height:0; }
  /* Hidden panes leave the grid flow, so single-pane views use a single
     column — the remaining pane auto-places into it. */
  body.view-code main, body.view-grid main { grid-template-columns: 1fr !important; }
  body.view-code #right, body.view-code #split { display:none; }
  body.view-grid #left, body.view-grid #split { display:none; }
  #left { display:flex; flex-direction:column; border-right:1px solid var(--edge); min-height:0; }
  #edwrap { flex:1; display:flex; min-height:0; position:relative; }
  #gutter { padding:.75rem .5rem .75rem .6rem; text-align:right; opacity:.35; user-select:none;
    overflow:hidden; border-right:1px solid var(--edge); min-width:2.6em; white-space:pre; }
  #edstack { position:relative; flex:1; min-width:0; }
  #hl, #src { position:absolute; inset:0; margin:0; padding:.75rem 1rem; font:inherit;
    line-height:inherit; white-space:pre; tab-size:4; }
  #hl { overflow:hidden; pointer-events:none; }
  #hl code { display:block; font:inherit; }
  #hl .cl { min-height:1.45em; }
  #src { border:0; resize:none; outline:none; background:transparent; overflow:auto;
    color:transparent; caret-color: CanvasText; }
  #src::selection { background: rgba(42,125,209,.25); }
  .tk-kw { color:#a626a4; font-weight:600; }
  .tk-ms { color:var(--accent); }
  .tk-mb { color:#0e8a7d; }
  .tk-un { color:#1a7f37; }
  .tk-num, .tk-pct { color:#b25f00; }
  .tk-cm { color:#8a8a8a; font-style:italic; }
  .tk-dir { color:#8a8a8a; font-weight:600; }
  .tk-sym { opacity:.7; }
  #hl .eline { background: rgba(221,51,51,.14); border-radius:3px; }
  #comp { position:absolute; z-index:9; background:Canvas; border:1px solid var(--edge);
    border-radius:6px; box-shadow:0 4px 18px rgba(0,0,0,.25); font-size:.9em;
    max-height:14em; overflow:auto; min-width:16em; }
  #comp .ci { padding:.12rem .6rem; cursor:pointer; display:flex; gap:.8rem; }
  #comp .ci .ck { margin-left:auto; opacity:.55; font-size:.85em; }
  #comp .ci.sel { background: rgba(42,125,209,.18); }
  #err { color: var(--bad); white-space: pre-wrap; padding:.4rem 1rem;
         border-top:1px solid var(--edge); min-height:1.5rem; }
  #err.on { background: rgba(221,51,51,.12); font-weight:600; }
  #err.warn { color:#b8860b; background: rgba(184,134,11,.12); font-weight:600; }
  #right.stale { opacity:.45; filter: grayscale(.6); transition: opacity .2s; }
  #foot .lbl { opacity:.5; margin-right:.5rem; }
  #right { overflow:auto; min-height:0; }
  table { border-collapse: collapse; width: max-content; min-width:100%; }
  th, td { text-align: right; padding:.22rem .55rem; border-bottom:1px solid var(--edge);
           white-space:nowrap; }
  thead th { position: sticky; top: 0; background: Canvas; z-index: 2; }
  th:first-child, td:first-child { text-align:left; position:sticky; left:0;
    background: Canvas; z-index:1; max-width: 220px; overflow:hidden; text-overflow:ellipsis; }
  tbody tr:hover td { background: rgba(128,128,128,.07); }
  tbody tr:hover td:first-child { background: Canvas; box-shadow: inset 0 0 0 999px rgba(128,128,128,.07); }
  td.neg { color: #c0392b; }
  tr.inp td { background: rgba(42,125,209,.035); }
  td:first-child { box-shadow: 2px 0 4px -2px rgba(0,0,0,.15); }
  td.chg { background: rgba(255,200,0,.3); }
  td.out { opacity:.35; }
  td input { font:inherit; width: 7.5em; text-align:right; border:0; border-bottom:1px dashed var(--accent);
             background: rgba(42,125,209,.07); color:inherit; outline:none; padding:0; }
  tr.inp td:first-child { color: var(--accent); }
  .unit { opacity:.5; font-size:.85em; margin-left:.4em; }
  #foot { display:flex; gap:1.5rem; padding:.4rem 1rem; border-top:1px solid var(--edge);
          flex-wrap:wrap; align-items:baseline; }
  .pass::before { content:"✓ "; color:var(--ok); } .fail::before { content:"✗ "; color:var(--bad); }
  #scalars span { margin-right:1rem; opacity:.9; padding:.1rem .45rem; border:1px solid var(--edge);
    border-radius:8px; }
  #scalars span:hover { border-color: var(--accent); }
  #tornado { position:fixed; right:1rem; bottom:3rem; background:Canvas; border:1px solid var(--edge);
    border-radius:8px; padding:.6rem .9rem; box-shadow:0 4px 18px rgba(0,0,0,.25); max-width:420px; z-index:6; }
  #inspect { position:fixed; right:1rem; bottom:3rem; background:Canvas; border:1px solid var(--edge);
    border-radius:8px; padding:.6rem .9rem; box-shadow:0 4px 18px rgba(0,0,0,.25);
    max-width:440px; max-height:60vh; overflow:auto; z-index:5; }
  #inspect h3 { margin:.15rem 0 .3rem; font-size:.92rem; }
  #inspect .crumb { font-size:.78rem; opacity:.75; margin-bottom:.15rem; }
  #inspect .meta { font-size:.78rem; opacity:.8; margin:.1rem 0; }
  #inspect .dep { display:flex; gap:.5rem; align-items:baseline; font-size:.82rem;
    padding:.12rem 0; border-top:1px dashed var(--dim); }
  #inspect .dep .dv { margin-left:auto; font-weight:600; }
  #inspect .via { font-size:.72em; border:1px solid var(--edge); border-radius:8px;
    padding:0 .35em; opacity:.7; }
  #inspect a { color:var(--accent); text-decoration:none; }
  #inspect .close { float:right; cursor:pointer; opacity:.6; }
  #inspect .term { display:grid; grid-template-columns: 130px 1fr 110px; gap:.45rem;
    align-items:center; font-size:.78rem; margin:.1rem 0; }
  #inspect .term .tl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #inspect .ttrack { position:relative; height:9px; background:var(--dim); border-radius:5px; }
  #inspect .tbar { position:absolute; left:0; top:0; height:100%; background:var(--ok); border-radius:5px; }
  #inspect .tbar.neg { background:var(--bad); }
  #inspect .tv { text-align:right; white-space:nowrap; }
  #inspect .share { opacity:.55; font-size:.85em; }
  #inspect button { font:inherit; font-size:.8rem; margin-top:.4rem; padding:.15rem .55rem;
    border:1px solid var(--edge); background:transparent; border-radius:5px; cursor:pointer; }
  td.hl { outline:2px solid var(--accent); outline-offset:-2px; }
  #tornado h3 { margin:.1rem 0 .5rem; font-size:.9rem; }
  #tornado .bar { display:grid; grid-template-columns: 150px 1fr; gap:.5rem; align-items:center;
    font-size:.8rem; margin:.15rem 0; }
  #tornado .track { position:relative; height:10px; background:var(--dim); border-radius:5px; }
  #tornado .dn, #tornado .up { position:absolute; top:0; height:100%; }
  #tornado .dn { background:#d33; right:50%; border-radius:5px 0 0 5px; }
  #tornado .up { background:var(--ok); left:50%; border-radius:0 5px 5px 0; }
  #tornado .close { float:right; cursor:pointer; opacity:.6; }
  td.torn { cursor: crosshair; }
  #simBtn.on { border-color:#8a2be2; color:#8a2be2; font-weight:600; }
  td.mname { cursor:pointer; }
  td .band { display:block; font-size:.72em; opacity:.55; }
</style>
</head>
<body>
<header>
  <h1>fml</h1>
  <select id="modelSel" title="Model"></select>
  <span id="scen"></span>
  <span class="actions">
    <button id="simBtn" title="Monte Carlo over distribution inputs (500 trials)">simulate</button>
    <button id="addPeriodBtn" title="Extend the calendar by one period (full-range maps copy their last entry)">+ period</button>
    <button id="addMemberBtn" title="Add a member to a dimension (arms inserted into every match)" style="display:none">+ member</button>
    <span id="amForm" style="display:none"></span>
    <button id="saveBtn" title="Save .fml to disk (Ctrl/Cmd+S)">save</button>
    <span id="draftState"></span>
  </span>
  <span class="views" id="views" title="Layout">
    <button data-v="code">code</button><button data-v="split" class="on">split</button><button data-v="grid">grid</button>
  </span>
  <span id="asserts" title="Model checks — every assert, every period"></span>
</header>
<div id="scenBanner" style="display:none"></div>
<div id="procBanner" style="display:none"></div>
<main>
  <div id="left">
    <div id="ftabs" style="display:none"></div>
    <div id="edwrap">
      <div id="gutter">1</div>
      <div id="edstack">
        <pre id="hl"><code id="hlcode"></code></pre>
        <textarea id="src" spellcheck="false" wrap="off"></textarea>
        <div id="comp" style="display:none"></div>
      </div>
    </div>
    <div id="err"></div>
  </div>
  <div id="split" title="Drag to resize"></div>
  <div id="right"><table id="tbl"></table></div>
</main>
<div id="foot">
  <span><span class="lbl">scalars</span><span id="scalars"></span></span>
  <span id="hint">click a cell to explain · click a name to inspect/rename · Ctrl+Space completes</span>
  <span id="stats">loading…</span>
</div>
<script type="module">
const MODELS = ["rolling", "budget", "team_budget", "finplan", "solar_pf", "fx_consol"];
const enc = new TextEncoder(), dec = new TextDecoder();
let exports, prev = {}, current = "finplan", loadedOk = false, lastState = null;
let baseVals = {}, activeScen = "Base";
let simBands = null;   // name -> bands (per-slot [p10,p50,p90]) when sim mode on
// ---- client mode: ?server=http://localhost:5199&token=alice.<hmac> ----
// (mint tokens with:  fml-server token alice)
const PARAMS = new URLSearchParams(location.search);
const SERVER = PARAMS.get("server");
const TOKEN = PARAMS.get("token") || "";
const USER = TOKEN ? TOKEN.split(".")[0] : (PARAMS.get("user") || "anon");
let myGrants = [];
function authorized(measure, member) {
  return myGrants.some(g =>
    g.measure === "*" ||
    (g.measure === measure && (g.member === null || g.member === member)));
}
// ---- multi-file state: main + any included files, with per-file drafts ----
let fileTexts = {}, diskTexts = {}, activeFile = "";
const mainFile = () => current + ".fml";
// Main keeps the legacy draft key so pre-tabs drafts survive.
const draftKey = (f) => {
  f = f || activeFile;
  return f === mainFile() ? "fml:draft:" + current : "fml:draft:" + current + ":" + f;
};
function saveDraftFor(name) {
  if (fileTexts[name] === diskTexts[name]) {
    localStorage.removeItem(draftKey(name));
  } else {
    localStorage.setItem(draftKey(name), fileTexts[name]);
  }
  updateDraftState();
}
function saveDraft() { saveDraftFor(activeFile); }
function updateDraftState() {
  const el = document.getElementById("draftState");
  const has = localStorage.getItem(draftKey()) !== null;
  el.innerHTML = has
    ? 'draft <button id="revertBtn" title="Discard the draft and reload the file">revert</button>'
    : "";
  const rb = document.getElementById("revertBtn");
  if (rb) rb.addEventListener("click", () => {
    localStorage.removeItem(draftKey());
    fileTexts[activeFile] = diskTexts[activeFile];
    document.getElementById("src").value = fileTexts[activeFile];
    updateDraftState();
    renderHl();
    loadModel("revert");
  });
}
function renderTabs() {
  const box = document.getElementById("ftabs");
  const names = Object.keys(fileTexts);
  box.style.display = names.length > 1 ? "flex" : "none";
  box.innerHTML = "";
  if (names.length <= 1) return;
  for (const n of names) {
    const b = document.createElement("button");
    b.textContent = n + (localStorage.getItem(draftKey(n)) !== null ? " •" : "");
    b.classList.toggle("on", n === activeFile);
    b.addEventListener("click", () => {
      activeFile = n;
      srcBox.value = fileTexts[n];
      renderTabs();
      updateDraftState();
      renderHl();
    });
    box.appendChild(b);
  }
}
async function saveToDisk() {
  const text = fileTexts[activeFile] ?? document.getElementById("src").value;
  const name = activeFile || current + ".fml";
  if (window.showSaveFilePicker) {
    try {
      const h = await showSaveFilePicker({
        suggestedName: name,
        types: [{ description: "fml model", accept: { "text/plain": [".fml"] } }],
      });
      const w = await h.createWritable();
      await w.write(text);
      await w.close();
      return;
    } catch (e) {
      if (e.name === "AbortError") return; // user cancelled
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

function writeInput(str) {
  const bytes = enc.encode(str);
  const ptr = exports.fml_input_ptr(bytes.length);
  new Uint8Array(exports.memory.buffer, ptr, bytes.length).set(bytes);
}
function readResult() {
  const p = exports.fml_result_ptr(), l = exports.fml_result_len();
  return JSON.parse(dec.decode(new Uint8Array(exports.memory.buffer, p, l)));
}
function fmt(v) {
  if (v === null) return "·";
  const a = Math.abs(v);
  if (a >= 1000) return v.toLocaleString("en-US", {maximumFractionDigits: 0});
  if (a < 10 && a !== 0) return v.toLocaleString("en-US", {maximumFractionDigits: 4});
  return v.toLocaleString("en-US", {maximumFractionDigits: 2});
}
function stats(r, us, what) {
  document.getElementById("stats").innerHTML =
    `${what}: <b>${r.steps_run}/${r.steps_total}</b> steps · ${r.nodes_changed} cells · <b>${us.toFixed(0)} µs</b>`;
}
function renderScenChips(r) {
  const box = document.getElementById("scen");
  const names = ["Base", ...(r.scenarios || [])];
  activeScen = r.active || "Base";
  box.innerHTML = "";
  if (names.length === 1) return;
  for (const n of names) {
    const b = document.createElement("button");
    b.textContent = n;
    b.classList.toggle("on", n === activeScen);
    b.addEventListener("click", () => {
      writeInput(n);
      const t0 = performance.now();
      if (exports.fml_scenario() === 0) {
        const r2 = readResult();
        stats(r2, (performance.now() - t0) * 1000, n === "Base" ? "Base" : `scenario ${n}`);
        render(r2);
      } else {
        setErr(readResult().error);
      }
    });
    box.appendChild(b);
  }
}
// Adopt new per-file sources (from a patch or a structural edit).
function adoptFiles(files) {
  (files || []).forEach((f, i) => {
    const key = i === 0 ? mainFile() : f.name;
    if (fileTexts[key] !== f.src) {
      fileTexts[key] = f.src;
      saveDraftFor(key);
      if (key === activeFile) {
        const top = srcBox.scrollTop;
        srcBox.value = f.src;
        srcBox.scrollTop = top;
        renderHl();
      }
    }
  });
}
// Apply a successful fml_patch result: sync per-file sources + rerender.
function syncPatchResult(r2, us, what) {
  stats(r2, us, what);
  adoptFiles(r2.files);
  renderTabs();
  render(r2);
}
function render(r) {
  lastState = r;
  const banner = document.getElementById("scenBanner");
  const scen = r.active && r.active !== "Base" ? r.active : null;
  banner.style.display = scen ? "flex" : "none";
  if (scen) {
    banner.innerHTML = `viewing scenario <b>${scen}</b> — cells colored vs Base (hover for Base values)
      <button id="backBase">back to Base</button>`;
    banner.querySelector("#backBase").addEventListener("click", () => {
      writeInput("Base");
      if (exports.fml_scenario() === 0) render(readResult());
    });
  }
  const amb = document.getElementById("addMemberBtn");
  if (amb) amb.style.display = !SERVER && r.dims && r.dims.length ? "" : "none";
  renderScenChips(r);
  const inScen = (r.active || "Base") !== "Base";
  let html = "<thead><tr><th>measure</th>" +
    r.periods.map(p => `<th>${p}</th>`).join("") + "</tr></thead><tbody>";
  for (const s of r.series) {
    const cls = s.input ? "inp" : "";
    const nameData = SERVER ? "" : ` class="mname" data-nkey="${s.key}" data-nmember="${s.member || ""}" data-nt="${s.range[0]}"`;
    html += `<tr class="${cls}"><td title="${s.name}"${nameData}>${s.name}<span class="unit">${s.unit}</span></td>`;
    s.vals.forEach((v, t) => {
      const inRange = t >= s.range[0] && t <= s.range[1];
      let editable = !inScen && (s.edit === "all" ? inRange : Array.isArray(s.edit) && s.edit.includes(t));
      if (SERVER) editable = editable && authorized(s.key, s.member || null)
        && (!window.clientCanEdit || window.clientCanEdit());
      if (editable) {
        html += `<td><input data-key="${s.key}" data-member="${s.member || ""}" data-t="${t}" value="${v === null ? "" : v}"></td>`;
      } else if (inScen) {
        // diff-vs-Base coloring with the Base value as tooltip
        const b = baseVals[s.name] ? baseVals[s.name][t] : null;
        const differs = b !== null && v !== null && Math.abs(v - b) > 1e-9;
        const dir = differs ? (v > b ? "dup" : "ddown") : "";
        const tip = differs ? ` title="Base: ${fmt(b)}"` : "";
        html += `<td class="${dir}${inRange ? "" : " out"}${v !== null && v < 0 ? " neg" : ""}"${tip}>${fmt(v)}</td>`;
      } else if (simBands && simBands[s.name] && inRange && !s.input) {
        const [b10, b50, b90] = simBands[s.name][t] || [null, null, null];
        const band = (b10 !== null && Math.abs(b90 - b10) > 1e-9)
          ? `<span class="band">${fmt(b10)} … ${fmt(b90)}</span>` : "";
        html += `<td class="${b50 !== null && b50 < 0 ? "neg" : ""}" title="p10 ${fmt(b10)} · p50 ${fmt(b50)} · p90 ${fmt(b90)}">${fmt(b50)}${band}</td>`;
      } else {
        const changed = prev[s.name] && prev[s.name][t] !== v;
        const torn = !SERVER && !inScen && inRange && !s.input ? " torn" : "";
        const tdata = torn ? ` data-tkey="${s.key}" data-tmember="${s.member || ""}" data-tt="${t}" title="click: explain this number"` : "";
        html += `<td class="${changed ? "chg" : ""}${inRange ? "" : " out"}${torn}${v !== null && v < 0 ? " neg" : ""}"${tdata}>${fmt(v)}</td>`;
      }
    });
    prev[s.name] = s.vals;
    if (!inScen) baseVals[s.name] = s.vals;
    html += "</tr>";
  }
  html += "</tbody>";

          if (exports.fml_recalc() === 0) {
            const r2 = readResult();
            stats(r2, (performance.now() - t1) * 1000, "goal-seek applied (runtime only)");
            render(r2);
          }
        }
        document.getElementById("inspect")?.remove();
        clearHl();
        inspectStack = [];
      });
    });
  });
  div.querySelector("#rnBtn").addEventListener("click", () => {
    const form = div.querySelector("#rnForm");
    form.innerHTML = `<div class="meta" style="margin-top:.4rem">rename to
      <input id="rnNew" style="width:10em;font:inherit" value="${ex.name}"> <button id="rnGo">apply everywhere</button>
      <div id="rnOut" class="meta"></div></div>`;
    const inp = form.querySelector("#rnNew");
    inp.focus();
    inp.select();
    form.querySelector("#rnGo").addEventListener("click", () => {
      const next = inp.value.trim();
      if (!next || next === ex.name) return;
      writeInput(ex.name + "|" + next);
      if (exports.fml_rename() !== 0) {
        form.querySelector("#rnOut").textContent = readResult().error;
        return;
      }
      adoptFiles(readResult().files);
      document.getElementById("inspect")?.remove();
      clearHl();
      inspectStack = [];
      loadModel(`renamed ${ex.name} → ${next}`);
    });
  });
  const fx = div.querySelector("#fxBtn");
  if (fx) fx.addEventListener("click", () => {
    const form = div.querySelector("#fxForm");
    form.innerHTML = `<div class="meta" style="margin-top:.4rem">
      <textarea id="fxBody" rows="3" style="width:100%;font:inherit">${ex.body}</textarea>
      <button id="fxGo">apply</button> <span id="fxOut"></span></div>`;
    const ta = form.querySelector("#fxBody");
    ta.focus();
    form.querySelector("#fxGo").addEventListener("click", () => {
      const body = ta.value.trim();
      if (!body || body === ex.body) return;
      writeInput(ex.name + "|" + body);
      if (exports.fml_replace_formula() !== 0) {
        form.querySelector("#fxOut").textContent = readResult().error;
        return;
      }
      adoptFiles(readResult().files);
      document.getElementById("inspect")?.remove();
      clearHl();
      inspectStack = [];
      loadModel(`formula of ${ex.name} changed`);
    });
  });
  const tb = div.querySelector("#tornBtn");
  if (tb) tb.addEventListener("click", () => {
    writeInput(ex.member ? ex.name + "|" + ex.member : ex.name);
    const t0 = performance.now();
    if (exports.fml_tornado(ex.period, 0.10) !== 0) { setErr(readResult().error); return; }
    showTornado(cellDisplay(ex.name, ex.member) + " @ " + ex.label, readResult().bars,
      (performance.now() - t0) * 1000);
  });
  highlightDeps(ex.deps);
}
function showTornado(title, bars, us) {
  document.getElementById("tornado")?.remove();
  const div = document.createElement("div");
  div.id = "tornado";
  const maxAbs = Math.max(...bars.map(b => Math.max(Math.abs(b[1]), Math.abs(b[2]))), 1e-12);
  div.innerHTML = `<span class="close" onclick="this.parentNode.remove()">✕</span>
    <h3>tornado: ${title} <small style="opacity:.5">(inputs ±10%, ${us.toFixed(0)} µs)</small></h3>` +
    bars.map(([label, dn, up]) => {
      const w = v => (Math.abs(v) / maxAbs * 50).toFixed(1);
      return `<div class="bar"><span title="${label}">${label}</span>
        <span class="track">
          <span class="dn" style="width:${w(dn)}%"></span>
          <span class="up" style="width:${w(up)}%"></span>
        </span></div>`;
    }).join("");
  document.body.appendChild(div);
}

const { instance } = await WebAssembly.instantiate(
  await (await fetch("fml.wasm?v=" + Date.now())).arrayBuffer(), {});
exports = instance.exports;

const srcBox = document.getElementById("src");
async function switchModel(name) {
  current = name;
  document.getElementById("modelSel").value = name;
  document.title = `fml · ${name}`;
  fileTexts = {};
  diskTexts = {};
  activeFile = mainFile();
  diskTexts[activeFile] = await (await fetch(name + ".fml?v=" + Date.now())).text();
  const draft = localStorage.getItem(draftKey());
  fileTexts[activeFile] = draft !== null ? draft : diskTexts[activeFile];
  srcBox.value = fileTexts[activeFile];
  updateDraftState();
  renderHl();
  await loadModel(draft !== null ? "draft restored" : "compile+run");
}
const msel = document.getElementById("modelSel");
for (const m of MODELS) {
  const o = document.createElement("option");
  o.value = o.textContent = m;
  msel.appendChild(o);
}
msel.addEventListener("change", () => switchModel(msel.value));

// live text editing: debounced full recompile
let timer = null;
srcBox.addEventListener("input", () => {
  renderHl();
  maybeComplete(false);
  clearTimeout(timer);
  timer = setTimeout(() => {
    fileTexts[activeFile] = srcBox.value;
    saveDraft();
    loadModel("recompile");
  }, 350);
});
srcBox.addEventListener("scroll", syncScroll);
srcBox.addEventListener("keydown", e => {
  if (compEl.style.display !== "none") {
    if (e.key === "ArrowDown") { e.preventDefault(); compSel = (compSel + 1) % compItems.length; renderComp(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); compSel = (compSel + compItems.length - 1) % compItems.length; renderComp(); return; }
    if (e.key === "Tab" || e.key === "Enter") { e.preventDefault(); acceptComp(); return; }
    if (e.key === "Escape") { hideComp(); return; }
  }
  if (e.key === " " && e.ctrlKey) { e.preventDefault(); maybeComplete(true); }
});
srcBox.addEventListener("blur", () => setTimeout(hideComp, 150));
document.getElementById("saveBtn").addEventListener("click", saveToDisk);
document.getElementById("addPeriodBtn").addEventListener("click", () => {
  if (SERVER || !loadedOk) return;
  if (exports.fml_add_period() !== 0) { setErr(readResult().error); return; }
  const r = readResult();
  adoptFiles(r.files);
  loadModel("added " + r.label);
});
document.getElementById("addMemberBtn").addEventListener("click", () => {
  if (SERVER || !loadedOk || !lastState?.dims?.length) return;
  const form = document.getElementById("amForm");
  if (form.style.display !== "none") { form.style.display = "none"; return; }
  const dims = lastState.dims;
  form.innerHTML = (dims.length > 1
      ? `<select id="amDim" style="font:inherit">${dims.map(d => `<option>${d.name}</option>`).join("")}</select> `
      : "")
    + `<input id="amName" placeholder="Member" style="width:7em;font:inherit">
       <input id="amDef" placeholder="default" value="0" style="width:4em;font:inherit">
       <button id="amGo">add</button>`;
  form.style.display = "";
  document.getElementById("amName").focus();
  document.getElementById("amGo").addEventListener("click", () => {
    const dim = dims.length > 1 ? document.getElementById("amDim").value : dims[0].name;
    const name = document.getElementById("amName").value.trim();
    const def = document.getElementById("amDef").value.trim() || "0";
    if (!name) return;
    writeInput(`${dim}|${name}|${def}`);
    if (exports.fml_add_member() !== 0) { setErr(readResult().error); return; }
    adoptFiles(readResult().files);
    form.style.display = "none";
    loadModel(`added ${dim}:${name}`);
  });
});
document.getElementById("simBtn").addEventListener("click", () => {
  if (SERVER) { setErr("simulate runs in local mode"); return; }
  const btn = document.getElementById("simBtn");
  if (simBands) {                        // exit sim mode
    simBands = null;
    btn.classList.remove("on");
    loadModel("back to deterministic");
    return;
  }
  const t0 = performance.now();
  if (exports.fml_simulate(500) !== 0) { setErr(readResult().error); return; }
  const r = readResult();
  simBands = {};
  for (const c of r.cells) if (c.series) simBands[c.name] = c.bands;
  btn.classList.add("on");
  document.getElementById("stats").innerHTML =
    `<b>simulated n=${r.trials}</b> · ${(performance.now() - t0).toFixed(0)} ms · cells show p50 with p10…p90`;
  // re-render current grid with bands (reuse last full state)
  writeInput("Base"); exports.fml_scenario(); render(readResult());
});
window.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "s") {
    e.preventDefault();
    saveToDisk();
  }
  if (e.key === "Escape") {
    document.getElementById("inspect")?.remove();
    document.getElementById("tornado")?.remove();
    clearHl();
    inspectStack = [];
    hideComp();
  }
});
// ---- layout: code / split / grid views + draggable divider ----
function setView(v) {
  document.body.classList.remove("view-code", "view-grid");
  if (v !== "split") document.body.classList.add("view-" + v);
  document.querySelectorAll("#views button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  localStorage.setItem("fml:view", v);
}
document.querySelectorAll("#views button").forEach(b =>
  b.addEventListener("click", () => setView(b.dataset.v)));
setView(localStorage.getItem("fml:view") || "split");
const mainEl = document.querySelector("main");
const savedSplit = localStorage.getItem("fml:splitpx");
if (savedSplit) mainEl.style.gridTemplateColumns = `${savedSplit}px 6px 1fr`;
document.getElementById("split").addEventListener("mousedown", e => {
  e.preventDefault();
  const move = ev => {
    const px = Math.max(240, Math.min(ev.clientX, window.innerWidth - 320));
    mainEl.style.gridTemplateColumns = `${px}px 6px 1fr`;
    localStorage.setItem("fml:splitpx", px);
  };
  const up = () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
});

await switchModel("finplan");
</script>
</body>
</html>
