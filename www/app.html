<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenFML · Budget Portal</title>
<style>
  :root {
    --navy: #16283f; --navy2: #1e3554; --navy3: #27436a;
    --bg: #f4f6f9; --card: #ffffff; --line: #e3e7ee;
    --ink: #1c2430; --mut: #6b7686; --pri: #2f6fd0; --pri2: #e8f0fc;
    --ok: #1e8e3e; --okbg: #e6f4ea; --warn: #b06000; --warnbg: #fdf3e1;
    --bad: #c5221f; --badbg: #fce8e6; --amber: #fff8e1; --amber2: #f9edc0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
         color: var(--ink); background: var(--bg); display: flex; }
  .num { font-variant-numeric: tabular-nums; font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: .93em; }

  /* ---- sidebar ---- */
  #side { width: 232px; min-width: 232px; background: var(--navy); color: #cfd9e6;
          display: flex; flex-direction: column; }
  #side .logo { padding: 1.1rem 1.2rem .9rem; color: #fff; font-weight: 700; font-size: 1.05rem;
                letter-spacing: .3px; border-bottom: 1px solid var(--navy3); }
  #side .logo small { display:block; font-weight: 400; color: #8fa3bb; font-size: .72rem; letter-spacing: 1px;
                text-transform: uppercase; margin-top: .15rem; }
  #side select { margin: .9rem 1rem .4rem; width: calc(100% - 2rem); background: var(--navy2); color: #fff;
                 border: 1px solid var(--navy3); border-radius: 6px; padding: .45rem .5rem; font: inherit; }
  #side select#verSel { margin-top: 0; font-size: .85rem; padding: .3rem .5rem; color: #ffd9a0; }
  #side nav { margin-top: .6rem; flex: 1; }
  #side nav a { display: flex; align-items: center; gap: .7rem; padding: .55rem 1.2rem; color: #cfd9e6;
                text-decoration: none; font-size: .92rem; border-left: 3px solid transparent; cursor: pointer; }
  #side nav a:hover { background: var(--navy2); }
  #side nav a.on { background: var(--navy2); border-left-color: var(--pri); color: #fff; font-weight: 600; }
  #side nav a .ic { width: 1.2em; text-align: center; opacity: .8; }
  #side .whoami { padding: .9rem 1.2rem; border-top: 1px solid var(--navy3); display: flex; gap: .7rem; align-items: center; }
  #side .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--pri); color: #fff;
                  display: flex; align-items: center; justify-content: center; font-weight: 700; }
  #side .whoami .nm { color: #fff; font-weight: 600; font-size: .9rem; }
  #side .whoami .rl { color: #8fa3bb; font-size: .75rem; }

  /* ---- main ---- */
  #maincol { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar { background: var(--card); border-bottom: 1px solid var(--line); padding: .7rem 1.6rem;
            display: flex; align-items: center; gap: 1rem; }
  #crumb { font-weight: 700; font-size: 1.02rem; }
  #crumb small { color: var(--mut); font-weight: 400; }
  .pill { padding: .18rem .7rem; border-radius: 999px; font-size: .78rem; font-weight: 600; }
  .pill.open { background: var(--okbg); color: var(--ok); }
  .pill.submitted { background: var(--warnbg); color: var(--warn); }
  .pill.locked { background: var(--badbg); color: var(--bad); }
  #syncdot { margin-left: auto; color: var(--mut); font-size: .78rem; }
  #content { flex: 1; overflow: auto; padding: 1.4rem 1.6rem; }

  /* ---- cards & KPIs ---- */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 1rem; margin-bottom: 1.2rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: .9rem 1.1rem;
          box-shadow: 0 1px 2px rgba(16,30,54,.04); }
  .card .lbl { color: var(--mut); font-size: .78rem; text-transform: uppercase; letter-spacing: .6px; }
  .card .val { font-size: 1.45rem; font-weight: 700; margin-top: .15rem; }
  .card .val small { font-size: .75rem; color: var(--mut); font-weight: 400; margin-left: .3rem; }
  .card svg { display: block; margin-top: .4rem; width: 100%; height: 34px; }
  .card.cov { display: flex; align-items: center; gap: .8rem; }
  .cov .dot { width: 12px; height: 12px; border-radius: 50%; }
  .cov.ok .dot { background: var(--ok); } .cov.bad .dot { background: var(--bad); animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  h2.sec { font-size: .85rem; text-transform: uppercase; letter-spacing: .8px; color: var(--mut); margin: 1.4rem 0 .7rem; }

  /* ---- enterprise grid ---- */
  .gridwrap { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: auto;
              box-shadow: 0 1px 2px rgba(16,30,54,.04); }
  table.grid { border-collapse: collapse; width: 100%; min-width: 640px; }
  .grid th, .grid td { padding: .42rem .9rem; text-align: right; border-bottom: 1px solid var(--line);
                       white-space: nowrap; }
  .grid thead th { position: sticky; top: 0; background: #fafbfd; color: var(--mut); font-size: .78rem;
                   text-transform: uppercase; letter-spacing: .5px; z-index: 2; border-bottom: 2px solid var(--line); }
  .grid th:first-child, .grid td:first-child { text-align: left; position: sticky; left: 0; background: var(--card);
                   z-index: 1; min-width: 190px; }
  .grid tr.ghead td { background: #f0f3f8; font-weight: 700; color: var(--navy2); font-size: .85rem; }
  .grid tr.ghead td.sp.in { background: #fdf6ec; cursor: text; color: var(--warn); }
  .grid tr.ghead td.sp.in:hover { background: #f9edd6; }
  .grid td.mname { padding-left: 2rem; color: var(--ink); }
  .grid .unit { color: var(--mut); font-size: .78rem; margin-left: .45rem; font-weight: 400; }
  .grid td.in { background: var(--amber); cursor: text; }
  .grid td.in:hover { background: var(--amber2); }
  .grid td.ro { color: #333c4b; }
  .grid td.neg { color: var(--bad); }
  .grid td.flash { animation: flash 1.1s; }
  @keyframes flash { 0% { background: #d7e7ff; } }
  .grid td input { width: 6.5em; font: inherit; text-align: right; border: 2px solid var(--pri); border-radius: 4px;
                   padding: .05rem .3rem; outline: none; }
  .legend { color: var(--mut); font-size: .78rem; margin: .6rem .2rem; }
  .legend .sw { display: inline-block; width: .9em; height: .9em; border-radius: 3px; vertical-align: -2px;
                margin: 0 .3em 0 1em; border: 1px solid var(--line); }

  /* ---- process board ---- */
  .depts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
  .dept { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; }
  .dept h3 { margin: 0 0 .3rem; font-size: .95rem; text-transform: capitalize; }
  .dept .st { font-size: .8rem; font-weight: 600; }
  .dept.sub { border-left: 4px solid var(--warn); } .dept.sub .st { color: var(--warn); }
  .dept.open { border-left: 4px solid var(--ok); } .dept.open .st { color: var(--ok); }
  button.act { font: inherit; font-size: .85rem; font-weight: 600; border: 0; border-radius: 6px; cursor: pointer;
               padding: .45rem 1rem; background: var(--pri); color: #fff; }
  button.act.ghost { background: var(--pri2); color: var(--pri); }
  button.act.danger { background: var(--badbg); color: var(--bad); }
  button.act:disabled { opacity: .45; cursor: default; }
  .toolbar { display: flex; gap: .6rem; margin: .9rem 0; flex-wrap: wrap; align-items: center; position: relative; }
  #fmtPop { position: absolute; top: calc(100% + 4px); right: 0; z-index: 35; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 40px rgba(16,30,54,.28);
    padding: .7rem .9rem; min-width: 250px; }
  #fmtPop label { display: flex; align-items: center; gap: .5rem; font-size: .82rem;
    margin: .3rem 0; justify-content: space-between; }
  #fmtPop select { border: 1px solid var(--line); border-radius: 5px; padding: .15rem .3rem; font-size: .8rem; }
  #fmtPop .fnote { color: var(--mut); font-size: .72rem; margin-top: .4rem; }

  /* ---- tables (audit, people) ---- */
  table.list { border-collapse: collapse; width: 100%; background: var(--card); }
  .list th, .list td { text-align: left; padding: .5rem .9rem; border-bottom: 1px solid var(--line); font-size: .88rem; }
  .list thead th { background: #fafbfd; color: var(--mut); font-size: .75rem; text-transform: uppercase; letter-spacing: .5px; }
  .k-patch { color: var(--pri); font-weight: 600; } .k-formula { color: #7b3ff2; font-weight: 600; }
  .k-submit { color: var(--warn); font-weight: 600; } .k-lock { color: var(--bad); font-weight: 700; }
  .k-reopen { color: var(--ok); font-weight: 600; }
  .rolebadge { padding: .1rem .55rem; border-radius: 999px; font-size: .75rem; font-weight: 700; }
  .rolebadge.admin { background: #f3e8fd; color: #7b3ff2; }
  .rolebadge.editor { background: var(--pri2); color: var(--pri); }
  .rolebadge.viewer { background: #eef0f3; color: var(--mut); }
  .tok { width: 100%; font: .8rem ui-monospace, monospace; padding: .35rem .5rem; margin-top: .4rem;
         border: 1px solid var(--line); border-radius: 6px; background: #fafbfd; }
  /* ---- hover documentation ---- */
  #hovertip { position: fixed; z-index: 60; max-width: 380px; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: .55rem .75rem;
    box-shadow: 0 10px 34px rgba(16,30,54,.24); font-size: .8rem; display: none;
    pointer-events: none; line-height: 1.5; }
  #hovertip .ht { font-family: "SF Mono", ui-monospace, monospace; font-weight: 700;
    font-size: .84rem; color: var(--navy2); }
  #hovertip .hk { display: inline-block; margin-left: .4rem; background: var(--pri2);
    color: var(--pri); border-radius: 999px; padding: .02rem .5rem; font-size: .68rem; font-weight: 700; }
  #hovertip .hd { color: #333c4b; margin-top: .15rem; }
  #hovertip .hx { font-family: "SF Mono", ui-monospace, monospace; font-size: .74rem;
    color: var(--mut); background: #fafbfd; border: 1px solid var(--line); border-radius: 6px;
    padding: .25rem .45rem; margin-top: .35rem; white-space: pre-wrap; }
  #hovertip .hv { font-family: "SF Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums; font-weight: 700; }
  .tdoc { border-bottom: 1px dotted #b3bccb; cursor: help; }
  [data-mh] { cursor: help; }

  /* ---- formula trace ---- */
  .tnode { border-left: 2px solid var(--line); margin: .3rem 0 .3rem .35rem; padding: .25rem 0 .25rem .8rem; }
  .tnode.root { border-left-color: var(--pri); }
  .tline { display: flex; align-items: baseline; gap: .55rem; flex-wrap: wrap; }
  .tname { font-family: "SF Mono", ui-monospace, monospace; font-weight: 700; font-size: .9rem; color: var(--navy2); }
  .tval { margin-left: auto; font-family: "SF Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; font-weight: 600; }
  .tunit { color: var(--mut); font-size: .74rem; }
  .tformula { font-family: "SF Mono", ui-monospace, monospace; font-size: .86rem; color: #333c4b; margin-top: .1rem; line-height: 1.7; word-break: break-word; }
  .tref { background: var(--pri2); color: var(--pri); border-radius: 5px; padding: .04rem .3rem; cursor: pointer; font-weight: 600; }
  .tref:hover { background: #d7e4fa; }
  .tref.openref { background: var(--navy2); color: #fff; }
  .tnote { color: var(--mut); font-size: .78rem; }

  #toast { position: fixed; bottom: 1.2rem; right: 1.4rem; background: var(--navy); color: #fff; padding: .6rem 1.1rem;
           border-radius: 8px; font-size: .88rem; box-shadow: 0 6px 24px rgba(0,0,0,.25); display: none; z-index: 40; }
  #toast.bad { background: var(--bad); }

  /* ---- login ---- */
  #login { position: fixed; inset: 0; background: var(--navy); display: flex; align-items: center;
           justify-content: center; z-index: 50; }
  #login .box { background: var(--card); border-radius: 14px; padding: 2.2rem 2.4rem; width: min(420px, 92vw);
                box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  #login h1 { margin: 0 0 .2rem; font-size: 1.3rem; }
  #login p { color: var(--mut); font-size: .88rem; }
  #login input { width: 100%; font: inherit; padding: .55rem .7rem; border: 1px solid var(--line);
                 border-radius: 8px; margin: .7rem 0 1rem; }
  #login button { width: 100%; }
</style>
</head>
<body>
<div id="login" style="display:none">
  <div class="box">
    <h1>Budget Portal</h1>
    <p>Enter your access token. Your finance administrator can issue one for you.</p>
    <input id="loginTok" placeholder="you.a1b2c3…" autofocus>
    <button class="act" id="loginGo">Sign in</button>
  </div>
</div>

<aside id="side" style="display:none">
  <div class="logo">Budget Portal<small>powered by OpenFML</small></div>
  <select id="modelSel"></select>
  <select id="verSel" style="display:none"></select>
  <nav>
    <a data-p="dash" class="on"><span class="ic">◧</span>Dashboard</a>
    <a data-p="entry"><span class="ic">▦</span>Budget entry</a>
    <a data-p="formulas"><span class="ic">⇄</span>Formulas</a>
    <a data-p="process"><span class="ic">◷</span>Workflow</a>
    <a data-p="audit" id="navAudit" style="display:none"><span class="ic">☰</span>Audit log</a>
    <a data-p="admin" id="navAdmin" style="display:none"><span class="ic">⚙</span>Administration</a>
  </nav>
  <div class="whoami"><div class="avatar" id="avatar">?</div>
    <div><div class="nm" id="whoNm">…</div><div class="rl" id="whoRl">…</div></div></div>
</aside>

<div id="maincol" style="display:none">
  <div id="topbar">
    <span id="crumb">Dashboard</span>
    <span class="pill open" id="roundPill">round open</span>
    <span id="syncdot">●</span>
  </div>
  <div id="content"></div>
</div>
<div id="toast"></div>
<div id="hovertip"></div>

<script type="module">
const P = new URLSearchParams(location.search);
// Served by openfml-server itself → same origin; the dev static server
// (5195) falls back to the conventional API port.
const SERVER = P.get("server") ||
  (location.port === "5195" ? "http://localhost:5199" : location.origin);
let TOKEN = P.get("token") || localStorage.getItem("fml:portal:token") || "";
let ME = null, MODEL = P.get("model") || "", MODELS = [], STATE = null, PROC = { locked: false, submitted: [] };
let VER = P.get("version") || "";
let GRANTS = [], PAGE = "dash", lastSeq = -1;
const $ = id => document.getElementById(id);
const qs = () => `?token=${encodeURIComponent(TOKEN)}&model=${encodeURIComponent(MODEL)}`
  + (VER ? `&version=${encodeURIComponent(VER)}` : "");
const get = async ep => (await fetch(SERVER + ep)).json();
const post = (ep, body) => fetch(SERVER + ep, { method: "POST",
  body: JSON.stringify(Object.assign({ token: TOKEN, model: MODEL },
    VER ? { version: VER } : {}, body || {})) }).then(r => r.json());
const nf = new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 });
const fmt = v => v === null || v === undefined ? "·"
  : v < 0 ? `(${nf.format(-v)})` : nf.format(v);
function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg;
  t.className = bad ? "bad" : "";
  t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => t.style.display = "none", 2600);
}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

// ---- boot ----------------------------------------------------------------
async function boot() {
  if (!TOKEN) { showLogin(); return; }
  let mi;
  try { mi = await get("/models?token=" + encodeURIComponent(TOKEN)); } catch { showLogin("Server unreachable at " + SERVER); return; }
  if (!mi.ok) { showLogin(mi.error || "invalid token"); return; }
  localStorage.setItem("fml:portal:token", TOKEN);
  ME = mi.me; MODELS = mi.models;
  MODEL = MODEL && MODELS.some(m => m.model === MODEL) ? MODEL : (MODELS[0]?.model || "");
  $("login").style.display = "none";
  $("side").style.display = "flex";
  $("maincol").style.display = "flex";
  $("avatar").textContent = ME.user.slice(0, 2).toUpperCase();
  $("whoNm").textContent = ME.user;
  if (mi.version) document.querySelector("#side .logo small").textContent = `powered by OpenFML v${mi.version}`;
  $("whoRl").textContent = `${ME.dept} · ${ME.role}`;
  $("navAudit").style.display = ME.role === "admin" ? "" : "none";
  $("navAdmin").style.display = ME.role === "admin" ? "" : "none";
  const sel = $("modelSel");
  sel.innerHTML = MODELS.map(m => `<option${m.model === MODEL ? " selected" : ""}>${esc(m.model)}</option>`).join("");
  sel.onchange = async () => { MODEL = sel.value; VER = ""; await refresh(); await loadVersions(); renderPage(); };
  await loadVersions();
  document.querySelectorAll("#side nav a").forEach(a => a.onclick = () => {
    document.querySelectorAll("#side nav a").forEach(x => x.classList.toggle("on", x === a));
    PAGE = a.dataset.p; renderPage();
  });
  await refresh();
  renderPage();
  setInterval(async () => {
    try {
      const s = await get("/seq" + qs());
      if (s.process) PROC = s.process;
      renderRound();
      if (s.seq !== lastSeq) { await refresh(); renderPage(); $("syncdot").textContent = "● live"; }
    } catch { $("syncdot").textContent = "○ offline"; }
  }, 2000);
}
async function loadVersions() {
  const vsel = $("verSel");
  let names = [];
  try {
    const r = await get("/versions" + qs());
    if (r.ok) names = r.versions.map(v => v.name);
  } catch { /* keep hidden */ }
  vsel.style.display = "";
  vsel.innerHTML = `<option value="">Budget of record</option>`
    + names.map(n => `<option value="${esc(n)}"${n === VER ? " selected" : ""}>version · ${esc(n)}</option>`).join("")
    + (ME.role !== "viewer" ? `<option value="__new">＋ New version…</option>` : "");
  vsel.onchange = async () => {
    if (vsel.value === "__new") {
      const name = (window.prompt("Name the new version (e.g. F3+9):") || "").trim();
      if (name) {
        const r = await post("/version", { name });
        if (!r.ok) { toast(r.error, true); }
        else { VER = name; toast(`version '${name}' created from the approved baseline`); }
      }
      await loadVersions();
    } else {
      VER = vsel.value;
    }
    await refresh();
    renderPage();
  };
}

function showLogin(msg) {
  $("login").style.display = "flex";
  if (msg) { const p = $("login").querySelector("p"); p.textContent = msg; p.style.color = "var(--bad)"; }
  $("loginGo").onclick = () => { TOKEN = $("loginTok").value.trim(); if (TOKEN) boot(); };
  $("loginTok").onkeydown = e => { if (e.key === "Enter") $("loginGo").click(); };
}
async function refresh() {
  STATE = await get("/state" + qs());
  PROC = STATE.process || PROC;
  lastSeq = STATE.seq;
  const g = await get("/grants" + qs());
  GRANTS = g.ok ? (g.users.find(u => u.user === ME.user) || { grants: [] }).grants : [];
  ensureInfo();
  renderRound();
}
function canEdit() {
  if (VER) return ME.role !== "viewer"; // versions ignore round state
  return !PROC.locked && ME.role !== "viewer" && (ME.role === "admin" || !PROC.submitted.includes(ME.dept));
}
function authorized(measure, member) {
  return GRANTS.some(g => g.measure === "*" || (g.measure === measure && (g.member === null || g.member === member)));
}
function renderRound() {
  const pill = $("roundPill");
  if (VER) {
    pill.className = "pill submitted";
    pill.textContent = `working in version · ${VER}`;
    return;
  }
  if (PROC.locked) { pill.className = "pill locked"; pill.textContent = "BUDGET LOCKED"; }
  else if (PROC.submitted.includes(ME.dept) && ME.role !== "admin") { pill.className = "pill submitted"; pill.textContent = `${ME.dept} submitted`; }
  else { pill.className = "pill open"; pill.textContent = PROC.submitted.length ? `round open · ${PROC.submitted.length} submitted` : "round open"; }
}

// ---- pages ----------------------------------------------------------------
function renderPage() {
  $("crumb").innerHTML = { dash: "Dashboard", entry: "Budget entry", formulas: "Formulas",
    process: "Workflow", audit: "Audit log", admin: "Administration" }[PAGE] + ` <small>· ${esc(MODEL)}</small>`;
  ({ dash: pageDash, entry: pageEntry, formulas: pageFormulas, process: pageProcess,
     audit: pageAudit, admin: pageAdmin })[PAGE]();
}

function spark(vals) {
  const v = vals.filter(x => x !== null);
  if (v.length < 2) return "";
  const min = Math.min(...v), max = Math.max(...v), spread = max - min || 1;
  const pts = v.map((x, i) => `${(i / (v.length - 1)) * 100},${30 - ((x - min) / spread) * 26}`).join(" ");
  return `<svg viewBox="0 0 100 34" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="var(--pri)" stroke-width="2"/></svg>`;
}

function pageDash() {
  const s = STATE;
  const covs = (s.asserts || []).map(([n, ok]) =>
    `<div class="card cov ${ok ? "ok" : "bad"}"><span class="dot"></span>
     <div><div class="lbl">covenant</div><div style="font-weight:600">${esc(n)}</div></div></div>`).join("");
  const scalars = (s.scalars || []).filter(x => !x.input).map(x =>
    `<div class="card"><div class="lbl">${esc(x.name)}</div>
     <div class="val num">${fmt(x.val)}<small>${esc(x.unit)}</small></div></div>`).join("");
  // Key computed series: undimensioned flows ranked by FY magnitude.
  const keys = (s.series || [])
    .filter(r => !r.input && !r.member)
    .map(r => ({ r, fy: r.vals.reduce((a, b) => a + (b || 0), 0) }))
    .sort((a, b) => Math.abs(b.fy) - Math.abs(a.fy))
    .slice(0, 4)
    .map(({ r, fy }) =>

function pageEntry() {
  const s = STATE;
  const editableRound = canEdit();
  let rows = "", lastKey = null;
  for (const r of s.series || []) {
    const grouped = !!r.member;
    if (grouped && r.key !== lastKey) {
      // Σ splash row: type a total here — it distributes to the members
      // in proportion (only when you may write every member).
      const members = s.series.filter(x => x.key === r.key);
      const totMax = Math.max(0, ...r.vals.map((_, t) =>
        Math.abs(members.reduce((a, m) => a + (m.vals[t] || 0), 0))));
      rows += `<tr class="ghead"><td data-mh="${esc(r.key)}">Σ ${esc(r.key)}<span class="unit">${esc(r.unit)}</span></td>`;
      r.vals.forEach((_, t) => {
        const tot = members.reduce((a, m) => a + (m.vals[t] || 0), 0);
        const inR = t >= r.range[0] && t <= r.range[1];
        const ok = inR && editableRound && members.every(m => {
          const sited = m.edit === "all" ? true : Array.isArray(m.edit) && m.edit.includes(t);
          return m.input && sited && authorized(m.key, m.member || null);
        });
        rows += `<td class="num sp${ok ? " in" : ""}" data-raw="${tot}"
          ${ok ? `data-skey="${esc(r.key)}" data-st="${t}"` : ""}>${inR ? fmtCell(tot, r.unit, totMax) : "·"}</td>`;
      });
      rows += `</tr>`;
    }
    lastKey = grouped ? r.key : null;
    const label = grouped ? r.member : r.name;
    rows += `<tr><td class="${grouped ? "mname" : ""}" data-mh="${esc(r.key)}">${esc(label)}${grouped ? "" : `<span class="unit">${esc(r.unit)}</span>`}</td>`;
    const rowMax = Math.max(0, ...r.vals.filter(x => x !== null).map(Math.abs));
    r.vals.forEach((v, t) => {
      const inRange = t >= r.range[0] && t <= r.range[1];
      const sited = r.edit === "all" ? inRange : Array.isArray(r.edit) && r.edit.includes(t);
      const editable = r.input && sited && editableRound && authorized(r.key, r.member || null);
      const cls = editable ? "in" : "ro";
      rows += `<td class="num ${cls}${v !== null && v < 0 ? " neg" : ""}${inRange ? "" : " ro"}"
        data-raw="${v === null ? "" : v}"
        ${editable ? `data-key="${esc(r.key)}" data-member="${esc(r.member || "")}" data-t="${t}"` : ""}>${inRange ? fmtCell(v, r.unit, rowMax) : "·"}</td>`;
    });
    rows += "</tr>";
  }
  $("content").innerHTML = `
    <div class="toolbar">
      ${!PROC.submitted.includes(ME.dept) && ME.role !== "viewer" && !PROC.locked
        ? `<button class="act" id="submitBtn">Submit ${esc(ME.dept)}'s numbers</button>` : ""}
      <span class="legend">editable<span class="sw" style="background:var(--amber)"></span>
        computed<span class="sw" style="background:#fff"></span></span>
      <span class="legend" id="entryHelp" style="cursor:help;border:1px solid var(--line);border-radius:999px;padding:.15rem .6rem">⌨ entry codes</span>
      <span class="legend" id="fmtBtn" style="cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:.15rem .6rem">Aa format${FMT.scale > 1 ? ` · ×${FMT.scale === 1e6 ? "1m" : "1k"}` : ""}</span>
      <div id="fmtPop" style="display:none"></div>
    </div>
    <div class="gridwrap"><table class="grid">
      <thead><tr><th>Measure</th>${s.periods.map(p => `<th>${esc(p)}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  $("submitBtn")?.addEventListener("click", async () => {
    const r = await post("/submit");
    if (!r.ok) { toast(r.error, true); return; }
    PROC = r.process; toast(`${ME.dept} submitted — finance can now review`); await refresh(); renderPage();
  });
  const cellSel = (k, mb, t) =>
    `td.in[data-key="${CSS.escape(k)}"]` +
    (mb === undefined ? "" : `[data-member="${CSS.escape(mb || "")}"]`) +
    (t !== undefined ? `[data-t="${t}"]` : "");
  const cellCur = td => {
    const raw = td.dataset.raw;
    return raw === undefined || raw === "" ? 0 : Number(raw);
  };
  const neighbor = (td, dir) => {
    if (!dir) return null;
    if (dir === "right" || dir === "left") {
      const row = [...document.querySelectorAll(cellSel(td.dataset.key, td.dataset.member))]
        .sort((a, b) => Number(a.dataset.t) - Number(b.dataset.t));
      const i = row.findIndex(x => x === td);
      return row[i + (dir === "right" ? 1 : -1)] || null;
    }
    const col = [...document.querySelectorAll(`td.in[data-t="${td.dataset.t}"]`)];
    return col[col.findIndex(x => x === td) + 1] || null;
  };
  document.querySelectorAll("td.in:not(.sp)").forEach(td => td.addEventListener("click", () => {
    if (td.querySelector("input")) return;
    const cur = cellCur(td);
    td.innerHTML = `<input value="${cur || cur === 0 ? cur : ""}">`;
    const inp = td.querySelector("input");
    inp.focus(); inp.select();
    let done = false; // Enter commits, then the re-render blurs the input — fire once.
    const commit = async dir => {
      if (done) return;
      done = true;
      const raw = inp.value;
      const move = neighbor(td, dir);
      const moveTo = move ? { k: move.dataset.key, mb: move.dataset.member, t: move.dataset.t } : null;
      const parsed = parseEntry(raw, cur);
      if (parsed === null) {
        if (raw.trim() !== "") toast(`didn't understand "${raw}" — hover ⌨ entry codes`, true);
        renderPage(); reopen(moveTo); return;
      }
      // rightward targets: this row's editable cells from here on
      const cells = [...document.querySelectorAll(cellSel(td.dataset.key, td.dataset.member))]
        .filter(x => Number(x.dataset.t) >= Number(td.dataset.t))
        .sort((a, b) => Number(a.dataset.t) - Number(b.dataset.t));
      let entries;
      switch (parsed.op) {
        case "set": entries = [[Number(td.dataset.t), parsed.v]]; break;
        case "repeat": entries = cells.map(c => [Number(c.dataset.t), parsed.v]); break;
        case "even": entries = cells.map(c => [Number(c.dataset.t), parsed.v / cells.length]); break;
        case "prop": {
          const total = cells.reduce((a, c) => a + cellCur(c), 0);
          entries = Math.abs(total) < 1e-12
            ? cells.map(c => [Number(c.dataset.t), parsed.v / cells.length])
            : cells.map(c => [Number(c.dataset.t), parsed.v * cellCur(c) / total]);
          break;
        }
        case "grow": {
          const t0 = Number(td.dataset.t);
          entries = cells.slice(1).map(c =>
            [Number(c.dataset.t), cur * Math.pow(1 + parsed.pct, Number(c.dataset.t) - t0)]);
          break;
        }
      }
      entries = (entries || []).filter(([t, v]) => {
        const c = document.querySelector(cellSel(td.dataset.key, td.dataset.member, t));
        return !c || Math.abs(v - cellCur(c)) > 1e-12;
      });
      if (!entries.length) { renderPage(); reopen(moveTo); return; }
      let last = null;
      for (const [t, v] of entries) {
        const r = await post("/patch", { name: td.dataset.key, member: td.dataset.member,
          period: String(t), value: String(v) });
        if (!r.ok) { toast(r.error, true); renderPage(); return; }
        last = r;
      }
      await refresh(); renderPage();
      toast(entries.length > 1
        ? `spread across ${entries.length} periods · commit #${last.seq}`
        : `saved · commit #${last.seq}`);
      reopen(moveTo);
    };
    inp.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); commit("down"); }
      else if (e.key === "Tab") { e.preventDefault(); commit(e.shiftKey ? "left" : "right"); }
      else if (e.key === "Escape") { done = true; renderPage(); }
    });
    inp.addEventListener("blur", () => commit(null));
  }));
  function reopen(moveTo) {
    if (!moveTo) return;
    document.querySelector(cellSel(moveTo.k, moveTo.mb, moveTo.t))?.click();
  }
  document.querySelectorAll("td.sp.in").forEach(td => td.addEventListener("click", () => {
    if (td.querySelector("input")) return;
    const key = td.dataset.skey, t0 = Number(td.dataset.st);
    const cur = Number(td.dataset.raw) || 0;
    td.innerHTML = `<input value="${cur}">`;
    const inp = td.querySelector("input");
    inp.focus(); inp.select();
    let done = false;
    const commit = async () => {
      if (done) return;
      done = true;
      const parsed = parseEntry(inp.value, cur);
      if (parsed === null) {
        if (inp.value.trim() !== "") toast(`didn't understand "${inp.value}" — hover ⌨ entry codes`, true);
        renderPage(); return;
      }
      const row = [...document.querySelectorAll(`td.sp.in[data-skey="${CSS.escape(key)}"]`)]
        .filter(x => Number(x.dataset.st) >= t0)
        .sort((a, b) => Number(a.dataset.st) - Number(b.dataset.st));
      let totals;
      switch (parsed.op) {
        case "set": totals = [[t0, parsed.v]]; break;
        case "repeat": totals = row.map(c => [Number(c.dataset.st), parsed.v]); break;
        case "even": totals = row.map(c => [Number(c.dataset.st), parsed.v / row.length]); break;
        case "prop": {
          const tt = row.reduce((a, c) => a + (Number(c.dataset.raw) || 0), 0);
          totals = Math.abs(tt) < 1e-12
            ? row.map(c => [Number(c.dataset.st), parsed.v / row.length])
            : row.map(c => [Number(c.dataset.st), parsed.v * (Number(c.dataset.raw) || 0) / tt]);
          break;
        }
        case "grow":
          totals = row.slice(1).map(c =>
            [Number(c.dataset.st), cur * Math.pow(1 + parsed.pct, Number(c.dataset.st) - t0)]);
          break;
      }
      let n = 0, last = null;
      for (const [t, total] of totals || []) {
        const cells = [...document.querySelectorAll(cellSel(key, undefined))]
          .filter(x => x.dataset.member !== undefined && Number(x.dataset.t) === t);
        if (!cells.length) continue;
        const sum = cells.reduce((a, c) => a + cellCur(c), 0);
        for (const c of cells) {
          const share = Math.abs(sum) < 1e-12 ? total / cells.length : total * cellCur(c) / sum;
          if (Math.abs(share - cellCur(c)) < 1e-12) continue;
          const r2 = await post("/patch", { name: key, member: c.dataset.member,
            period: String(t), value: String(share) });
          if (!r2.ok) { toast(r2.error, true); renderPage(); return; }
          last = r2; n++;
        }
      }
      await refresh(); renderPage();
      if (n) toast(`splashed across ${n} cells · commit #${last.seq}`);
    };
    inp.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); commit(); }
      else if (e.key === "Escape") { done = true; renderPage(); }
    });
    inp.addEventListener("blur", () => commit());
  }));
  $("entryHelp")?.addEventListener("mouseover", e => showTipAt(e.clientX, e.clientY, ENTRY_LEGEND));
  $("entryHelp")?.addEventListener("mouseleave", hideTip);
  $("fmtBtn")?.addEventListener("click", e => {
    e.stopPropagation();
    const pop = $("fmtPop");
    if (pop.style.display !== "none") { pop.style.display = "none"; return; }
    pop.innerHTML = fmtPopHtml();
    pop.style.display = "";
    wireFmtPop(pop);
  });
}

function parseEntry(raw, cur) {
  raw = String(raw).trim();
  if (!raw) return null;
  cur = Number.isFinite(cur) ? cur : 0;
  const num = s => {
    const m = /^([+-]?[0-9][0-9_,]*\.?[0-9]*)\s*([kmb])?$/i.exec(String(s).trim());
    if (!m) return null;
    let v = parseFloat(m[1].replace(/[,_]/g, ""));
    if (m[2]) v *= { k: 1e3, m: 1e6, b: 1e9 }[m[2].toLowerCase()];
    return Number.isFinite(v) ? v : null;
  };
  let m;
  if ((m = /^\((.+)\)$/.exec(raw))) {                      // (500) — accounting negative
    const v = num(m[1]);
    return v === null ? null : { op: "set", v: -v };
  }
  if ((m = /^([+-])(.+)%$/.exec(raw))) {                     // +10% / -10% — grow/shrink
    const p = parseFloat(m[2]);
    return isNaN(p) ? null : { op: "set", v: cur * (1 + (m[1] === "+" ? 1 : -1) * p / 100) };
  }
  if ((m = /^[*x](.+)$/i.exec(raw))) {                       // *1.1 — multiply
    const f = parseFloat(m[1]);
    return isNaN(f) ? null : { op: "set", v: cur * f };
  }
  if ((m = /^g\s*([0-9.]+)\s*%?\s*>$/i.exec(raw)))         // g5> — grow rightward
    return { op: "grow", pct: parseFloat(m[1]) / 100 };
  if ((m = /^(.*)\/>$/.exec(raw))) {                        // 6k/> — split evenly rightward
    const v = num(m[1]);
    return v === null ? null : { op: "even", v };
  }
  if ((m = /^(.*)%>$/.exec(raw))) {                          // 6k%> — proportional rightward
    const v = num(m[1]);
    return v === null ? null : { op: "prop", v };
  }
  if ((m = /^(.*)>$/.exec(raw))) {                           // 500> or > — repeat rightward
    const s = m[1].trim();
    const v = s === "" ? cur : num(s);
    return v === null ? null : { op: "repeat", v };
  }
  if ((m = /^([+-])(.+)$/.exec(raw))) {                      // +500 / -500 — add/subtract
    const v = num(m[2]);
    return v === null ? null : { op: "set", v: cur + (m[1] === "+" ? 1 : -1) * v };
  }
  if (raw.endsWith("%")) {                                   // 10% — a rate
    const p = parseFloat(raw);
    return isNaN(p) ? null : { op: "set", v: p / 100 };
  }
  const v = num(raw);
  return v === null ? null : { op: "set", v };
}
// ---- display formatting: finance-grade, user-editable ------------------
let FMT = Object.assign({ dec: "auto", neg: "paren", scale: 1, pct: true, dash0: false },
  JSON.parse(localStorage.getItem("fml:fmt") || "{}"));
function saveFmt() {
  localStorage.setItem("fml:fmt", JSON.stringify(FMT));
  renderPage();
}
function isScaledUnit(unit) {
  return FMT.scale > 1 && unit !== "1" && unit !== "" && !unit.includes("/");
}
function fmtCell(v, unit, rowMax) {
  if (v === null || v === undefined) return "·";
  const dimless = unit === "1" || unit === "";
  if (FMT.pct && dimless && Math.abs(rowMax) < 10) {
    const pc = v * 100;
    return (pc < 0 ? "(" : "") + Math.abs(pc).toLocaleString("en-US",
      { minimumFractionDigits: 0, maximumFractionDigits: 1 }) + "%" + (pc < 0 ? ")" : "");
  }
  if (FMT.dash0 && v === 0) return "–";
  const scaled = isScaledUnit(unit);
  const x = scaled ? v / FMT.scale : v;
  const rm = Math.abs(scaled ? rowMax / FMT.scale : rowMax);
  const d = FMT.dec === "auto" ? (rm >= 1000 ? 0 : rm >= 20 ? 1 : 2) : Number(FMT.dec);
  const s = Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  if (x < 0) return FMT.neg === "paren" ? `(${s})` : `-${s}`;
  return s;
}
function fmtPopHtml() {
  return `
    <label>decimals <select id="fDec">
      <option value="auto"${FMT.dec === "auto" ? " selected" : ""}>auto (per row)</option>
      <option value="0"${FMT.dec === "0" ? " selected" : ""}>0</option>
      <option value="1"${FMT.dec === "1" ? " selected" : ""}>1</option>
      <option value="2"${FMT.dec === "2" ? " selected" : ""}>2</option></select></label>
    <label>negatives <select id="fNeg">
      <option value="paren"${FMT.neg === "paren" ? " selected" : ""}>(1,234)</option>
      <option value="minus"${FMT.neg === "minus" ? " selected" : ""}>-1,234</option></select></label>
    <label>show amounts <select id="fScale">
      <option value="1"${FMT.scale === 1 ? " selected" : ""}>at full value</option>
      <option value="1000"${FMT.scale === 1000 ? " selected" : ""}>in thousands (×1k)</option>
      <option value="1000000"${FMT.scale === 1e6 ? " selected" : ""}>in millions (×1m)</option></select></label>
    <label>rates as percent <input type="checkbox" id="fPct"${FMT.pct ? " checked" : ""}></label>
    <label>zeros as – <input type="checkbox" id="fDash"${FMT.dash0 ? " checked" : ""}></label>
    <div class="fnote">display only — you always type full values; entry codes
    (12k, +10%…) work on full values</div>`;
}
function wireFmtPop(pop) {
  const apply = () => {
    FMT.dec = pop.querySelector("#fDec").value;
    FMT.neg = pop.querySelector("#fNeg").value;
    FMT.scale = Number(pop.querySelector("#fScale").value);
    FMT.pct = pop.querySelector("#fPct").checked;
    FMT.dash0 = pop.querySelector("#fDash").checked;
    saveFmt();
  };
  pop.querySelectorAll("select, input").forEach(el => el.addEventListener("change", apply));
}
document.addEventListener("click", e => {
  const pop = document.getElementById("fmtPop");

});

  year:      ["time", "year(t) — the calendar year of the current period, usable in formulas."],
  min:       ["math", "The smaller of its arguments.", "min(draw_need, facility_cap)"],
  max:       ["math", "The larger of its arguments.", "max(0, taxable_income)"],
  metalog:   ["risk", "A flexible distribution fitted from your own P10/P50/P90 view. Deterministic runs use the median; Simulate draws from it.", "input growth : rate ~ metalog { p10: 1%, p50: 4%, p90: 9% }"],
  uniform:   ["risk", "Equally likely anywhere between two bounds.", "~ uniform(0.10, 0.14)"],
  normal:    ["risk", "The bell curve: mean and standard deviation.", "~ normal(22%, 2%) per period"],
  per:       ["risk", "'per period': a fresh independent draw every period (shocks) instead of one draw per trial (parameter uncertainty)."],
  by:        ["allocation", "The driver in an allocate: split the pot in proportion to this.", "allocate … = plant_overhead by revenue"],
  round:     ["precision", "Snap stored values to N decimals (posted amounts). In allocate: cent-exact largest-remainder split. Policies: half_up (default), half_even, floor, ceil.", "price_posted : EUR over m round 2 = raw_price"],
  tolerance: ["solver", "How close a solve block must get before it accepts convergence."],
  relax:     ["solver", "Tearing form of solve: name the circular variable and its starting guess.", "solve sculpt { relax debt init 1_000 }"],
  from:      ["scenario", "Scenario inheritance: start from another scenario's overrides.", "scenario Crash from Downturn { … }"],
  functional:["consolidation", "Marks the dimension whose members carry their own local currencies."],
  sha256:    ["fact plane", "Pins a data file to its exact content hash — the model refuses changed facts until the pin is updated deliberately."],
  flow:      ["typing", "A per-period amount (revenue, spend) — sums across periods are meaningful."],
  stock:     ["typing", "A balance at a point in time (assets, debt) — carried forward, not summed."],
  rate:      ["typing", "A dimensionless per-period ratio (growth, discount, tax)."],
  ratio:     ["typing", "A dimensionless proportion."],
  tree:      ["dimension", "Dimension form with a roll-up group equal to the sum of its members."],
  list:      ["dimension", "Dimension form without a roll-up member."],
};
function ensureInfo() {
  if (TRACE_INFO && TRACE_INFO._model === MODEL) return;
  get("/info" + qs()).then(r => { if (r.ok) { r._model = MODEL; TRACE_INFO = r; } }).catch(() => {});
}
const hoverTip = $("hovertip");
function hideTip() { hoverTip.style.display = "none"; }
function showTipAt(x, y, html) {
  hoverTip.innerHTML = html;
  hoverTip.style.display = "block";
  const w = hoverTip.offsetWidth, h = hoverTip.offsetHeight;
  hoverTip.style.left = Math.min(x + 14, window.innerWidth - w - 10) + "px";
  hoverTip.style.top = (y + 18 + h > window.innerHeight ? y - h - 10 : y + 18) + "px";
}
function measureCard(name) {
  const info = TRACE_INFO && TRACE_INFO.ok ? TRACE_INFO : null;
  const m = info && info.measures.find(x => x.name === name);
  if (!m) return null;
  const val = tval(name);
  const kind = m.input ? (m.data ? "fact" : "input") : m.solve ? "solve member" : "computed";
  const f = m.data ? `facts from ${m.data}` : (m.formula || "");
  return `<span class="ht">${esc(name)}</span><span class="hk">${kind}</span><span class="hk">${esc(m.unit)}</span>
    ${val ? `<div class="hd">currently <span class="hv">${val.v}</span> <span style="color:var(--mut)">${esc(val.u)}</span></div>` : ""}
    ${f ? `<div class="hx">= ${esc(f.length > 160 ? f.slice(0, 160) + "…" : f)}</div>` : ""}`;
}
function docCard(word) {
  const d = DOCS[word];
  if (!d) return null;
  return `<span class="ht">${esc(word)}</span><span class="hk">${esc(d[0])}</span>
    <div class="hd">${esc(d[1])}</div>${d[2] ? `<div class="hx">${esc(d[2])}</div>` : ""}`;
}
document.addEventListener("mouseover", e => {
  const el = e.target.closest ? e.target.closest(".tref, .tdoc, [data-mh]") : null;
  if (!el) { hideTip(); return; }
  ensureInfo();
  const html = el.classList.contains("tdoc") ? docCard(el.dataset.w)
    : measureCard(el.dataset.n || el.dataset.mh);
  if (html) showTipAt(e.clientX, e.clientY, html); else hideTip();
});
document.addEventListener("scroll", hideTip, true);


function tval(name) {
  const s = (STATE.series || []).filter(r => r.key === name);
  if (s.length) {
    const unit = s[0].unit || "";
    if (unit.includes("/") || unit === "1" || unit === "") {
      const t = s[0].range[1];
      return { v: fmt(s[0].vals[t]), u: unit + " · " + (STATE.periods[t] || "") };
    }
    const fy = s.reduce((a, r) => a + r.vals.reduce((x, v) => x + (v || 0), 0), 0);
    return { v: fmt(fy), u: unit + " · FY" };
  }
  const sc = (STATE.scalars || []).find(x => x.name === name);
  return sc ? { v: fmt(sc.val), u: sc.unit || "" } : null;
}
function tformula(m, byName) {
  if (m.data) return `<span class="tnote">facts from <b>${esc(m.data)}</b> — read-only, changes by re-import</span>`;
  if (m.dist) return `<span class="tnote">stochastic input (distribution)</span>`;
  if (m.formula === null || m.formula === undefined) return `<span class="tnote">source value</span>`;
  return esc(m.formula).split(/([A-Za-z_$][A-Za-z0-9_]*)/g).map(p =>
    byName[p] && p !== m.name
      ? `<span class="tref${traceOpen.has(m.name + "→" + p) ? " openref" : ""}" data-of="${esc(m.name)}" data-n="${esc(p)}">${p}</span>`
      : DOCS[p] ? `<span class="tdoc" data-w="${esc(p)}">${p}</span>` : p).join("");
}
function tnode(name, byName, seen, root) {
  const m = byName[name];
  if (!m) return "";
  const val = tval(name);
  const kids = (m.refs || []).filter(r => traceOpen.has(name + "→" + r) && !seen.has(r))
    .map(r => tnode(r, byName, new Set([...seen, r]), false)).join("");
  const tag = m.input ? (m.data ? "fact" : "input") : "";
  return `<div class="tnode${root ? " root" : ""}">
    <div class="tline"><span class="tname">${esc(name)}</span>
      ${tag ? `<span class="pill open" style="background:#eef0f3;color:var(--mut)">${tag}</span>` : ""}
      ${val ? `<span class="tval">${val.v}<span class="tunit"> ${esc(val.u)}</span></span>` : ""}</div>
    <div class="tformula">= ${tformula(m, byName)}</div>${kids}</div>`;
}
async function pageFormulas() {
  if (!TRACE_INFO || TRACE_INFO._model !== MODEL) {
    TRACE_INFO = await get("/info" + qs());
    TRACE_INFO._model = MODEL;
    traceOpen.clear();
    traceRoot = null;
  }
  const info = TRACE_INFO;
  if (!info.ok) { $("content").innerHTML = `<div class="card">${esc(info.error || "unavailable")}</div>`; return; }
  const byName = {};
  info.measures.forEach(m => byName[m.name] = m);
  const computed = info.measures.filter(m => !m.input).map(m => m.name);
  const all = [...computed, ...info.measures.filter(m => m.input).map(m => m.name)];
  if (!traceRoot) traceRoot = computed[computed.length - 1] || all[0];
  $("content").innerHTML = `
    <div class="toolbar" style="margin-top:0">
      <span style="color:var(--mut);font-size:.78rem;text-transform:uppercase;letter-spacing:.6px">Trace</span>
      <select id="traceSel" style="font:inherit;padding:.3rem .5rem;border:1px solid var(--line);border-radius:6px">
        ${all.map(n => `<option${n === traceRoot ? " selected" : ""}>${esc(n)}</option>`).join("")}</select>
      <span style="color:var(--mut);font-size:.8rem">where every number comes from — click a name in a formula to unfold it</span>
    </div>
    <div class="card">${tnode(traceRoot, byName, new Set([traceRoot]), true)}</div>`;
  $("traceSel").onchange = () => { traceRoot = $("traceSel").value; traceOpen.clear(); pageFormulas(); };
  document.querySelectorAll(".tref").forEach(el => el.addEventListener("click", () => {
    const key = el.dataset.of + "→" + el.dataset.n;
    if (traceOpen.has(key)) traceOpen.delete(key); else traceOpen.add(key);
    pageFormulas();
  }));
}

function pageProcess() {
  const depts = new Set(PROC.submitted);
  depts.add(ME.dept);
  const cards = [...depts].map(d => {
    const sub = PROC.submitted.includes(d);
    return `<div class="dept ${sub ? "sub" : "open"}"><h3>${esc(d)}</h3>
      <div class="st">${sub ? "✓ submitted" : "○ open"}</div>
      ${ME.role === "admin" && sub ? `<div style="margin-top:.6rem"><button class="act ghost reopen" data-d="${esc(d)}">Reopen</button></div>` : ""}
      ${d === ME.dept && !sub && ME.role !== "viewer" && !PROC.locked ? `<div style="margin-top:.6rem"><button class="act" id="pSubmit">Submit</button></div>` : ""}
    </div>`;
  }).join("");
  $("content").innerHTML = `
    <div class="depts">${cards}</div>
    <h2 class="sec">Round control</h2>
    <div class="card"><div class="toolbar" style="margin:0">
      ${ME.role === "admin" ? (PROC.locked
        ? `<button class="act ghost" id="unlockBtn">Unlock the budget</button>`
        : `<button class="act danger" id="lockBtn">Lock the budget</button>`) : ""}
      <span style="color:var(--mut);font-size:.85rem">
        ${PROC.locked ? "The budget is final — no further changes." :
          "Departments submit when done; finance reviews, reopens if needed, then locks."}</span>
    </div></div>`;
  $("pSubmit")?.addEventListener("click", async () => {
    const r = await post("/submit");
    if (!r.ok) { toast(r.error, true); return; }
    PROC = r.process; renderRound(); renderPage(); toast("submitted");
  });
  document.querySelectorAll(".reopen").forEach(b => b.addEventListener("click", async () => {
    const r = await post("/reopen", { dept: b.dataset.d });
    if (!r.ok) { toast(r.error, true); return; }
    PROC = r.process; renderRound(); renderPage(); toast(`${b.dataset.d} reopened`);
  }));
  $("lockBtn")?.addEventListener("click", async () => {
    const r = await post("/lock");
    if (!r.ok) { toast(r.error, true); return; }
    PROC = r.process; renderRound(); renderPage(); toast("budget locked");
  });
  $("unlockBtn")?.addEventListener("click", async () => {
    const r = await post("/reopen", { dept: "" });
    if (!r.ok) { toast(r.error, true); return; }
    PROC = r.process; renderRound(); renderPage(); toast("unlocked");
  });
}

async function pageAudit() {
  const r = await get("/log" + qs());
  const rows = (r.log || "").trim().split("\n").filter(Boolean).map(l => {
    const f = l.split("\t");
    if (f.length < 9) return null;
    const [seq, who, kind, name, member, period, value, , ts] = f;
    const when = ts && ts !== "0" ? new Date(Number(ts) * 1000).toLocaleString() : "—";
    const what = kind === "patch" ? `${name}${member !== "-" ? `[${member}]` : ""}${period !== "-" ? ` @ ${STATE.periods?.[Number(period)] ?? period}` : ""} = ${value}`
      : kind === "formula" ? `${name} — formula changed` : name !== "-" ? name : "";
    return `<tr><td>${seq}</td><td>${when}</td><td>${esc(who)}</td>
      <td class="k-${kind}">${kind}</td><td class="num" style="text-align:left">${esc(what)}</td></tr>`;
  }).filter(Boolean).reverse().join("");
  $("content").innerHTML = `
    <div class="card" style="margin-bottom:1rem;color:var(--mut);font-size:.85rem">
      Every entry is signed over the previous one — edited, deleted or reordered history refuses to load.</div>
    <div class="gridwrap"><table class="list">
      <thead><tr><th>#</th><th>When</th><th>Who</th><th>Action</th><th>Detail</th></tr></thead>
      <tbody>${rows || "<tr><td colspan=5>no events this round</td></tr>"}</tbody></table></div>`;
}

async function pageAdmin() {
  const u = await get("/users?token=" + encodeURIComponent(TOKEN));
  const rows = (u.users || []).map(x => `
    <tr><td>${esc(x.user)}</td><td style="text-transform:capitalize">${esc(x.dept)}</td>
      <td><span class="rolebadge ${x.role}">${x.role}</span></td>
      <td><button class="act ghost mint" data-u="${esc(x.user)}">Issue token</button></td></tr>`).join("");
  $("content").innerHTML = `
    <h2 class="sec" style="margin-top:0">People & access</h2>
    <div class="gridwrap"><table class="list">
      <thead><tr><th>User</th><th>Department</th><th>Role</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div id="mintOut"></div>
    <p style="color:var(--mut);font-size:.83rem">Roles and departments are declared in
      <code>users.cfg</code> / <code>access.cfg</code>; restart the server after editing.</p>
    <h2 class="sec">Versions (forecast copies)</h2>
    <div class="card" id="verCard"><div class="mnote" style="color:var(--mut);font-size:.85rem">
      A version is an editable copy forked from the approved baseline with its own signed
      audit log — departments keep filling it while the budget of record is locked.
      Promote folds its numbers into the primary as ordinary audited patches.</div>
      <div id="verList" style="margin-top:.6rem">loading…</div></div>
    <h2 class="sec">Round persistence</h2>
    <div class="card"><p style="margin:.2rem 0 .8rem;color:var(--mut);font-size:.88rem">
      Checkpoint writes the approved numbers back into the model files, archives the signed
      audit log, and opens the next round on that baseline. Typically run after locking.</p>
      <button class="act" id="ckBtn">Checkpoint this model</button> <span id="ckOut" style="font-size:.85rem"></span></div>`;
  (async () => {
    const r = await get("/versions" + qs());
    const box = $("verList");
    if (!r.ok) { box.textContent = r.error; return; }
    box.innerHTML = (r.versions || []).map(v => `
      <div class="toolbar" style="margin:.2rem 0">
        <b>${esc(v.name)}</b><span style="color:var(--mut);font-size:.8rem">${v.seq} change${v.seq === 1 ? "" : "s"}</span>
        <button class="act ghost vProm" data-v="${esc(v.name)}">Promote to budget of record</button>
        <button class="act danger vDrop" data-v="${esc(v.name)}">Drop</button></div>`).join("")
      || `<span style="color:var(--mut);font-size:.85rem">no versions yet — anyone but a viewer can start one from the sidebar</span>`;
    box.querySelectorAll(".vProm").forEach(b => b.addEventListener("click", async () => {
      const rr = await post("/promote", { name: b.dataset.v });
      if (!rr.ok) { toast(rr.error, true); return; }
      toast(`promoted '${b.dataset.v}' — ${rr.cells} cell${rr.cells === 1 ? "" : "s"} onto the primary · #${rr.seq}`);
      await refresh(); renderPage();
    }));
    box.querySelectorAll(".vDrop").forEach(b => b.addEventListener("click", async () => {
      if (!window.confirm(`Drop version '${b.dataset.v}'? Its log is archived, not deleted.`)) return;
      const rr = await post("/version_drop", { name: b.dataset.v });
      if (!rr.ok) { toast(rr.error, true); return; }
      if (VER === b.dataset.v) VER = "";
      toast("version dropped");
      await loadVersions(); renderPage();
    }));
  })();
  document.querySelectorAll(".mint").forEach(b => b.addEventListener("click", async () => {
    const r = await post("/mint", { user: b.dataset.u });
    $("mintOut").innerHTML = r.ok
      ? `<div class="card" style="margin-top:.8rem"><b>Token for ${esc(b.dataset.u)}</b> — share privately;
         they sign in with it at this portal.<input class="tok" readonly value="${esc(r.token)}" onclick="this.select()"></div>`
      : `<p style="color:var(--bad)">${esc(r.error)}</p>`;
  }));
  $("ckBtn").addEventListener("click", async () => {
    const r = await post("/checkpoint");
    $("ckOut").textContent = r.ok ? `✓ ${r.files.length} files written · log archived · new round open` : r.error;
    if (r.ok) { toast("checkpoint complete — new round"); await refresh(); }
  });
}

boot();
</script>
