# Release: on a v* tag, build installable bundles per platform and
# attach them to a GitHub Release. scripts/package.sh does the work
# (binaries + wasm UI + example + deploy template + installer).
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test --release
      - run: sh scripts/package.sh
      - name: attach bundle to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "OpenFML $GITHUB_REF_NAME" || true
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
